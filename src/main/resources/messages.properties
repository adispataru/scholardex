# H87 — Romanian bundle (the DEFAULT: no _ro suffix, so any unresolved locale lands here).
# Scope: UI chrome only. Report names, indicator names and standards wording stay Romanian in every
# locale — they are the labels of OM 3019/2025 and the FV templates, so translating them would
# misrepresent the standard. Keys must exist in every bundle (pinned by MessageBundleParityTest).

