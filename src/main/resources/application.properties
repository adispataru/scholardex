# H66B Phase 4b — DBLP per-paper conference resolve (keyless public API; replaces the whole-dump streaming).
# DBLP rate-limits a single IP aggressively; throttle politely (a 429 is retried once, then the candidate is skipped
# and re-resolved on the next sweep/sync — forumId stays null so the detector picks it up again).
dblp.api.base-url=https://dblp.org
dblp.api.max-hits=10
dblp.api.min-interval-ms=3000

