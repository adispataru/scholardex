# H73/H75 — file-driven OpenAlex bulk import for the full from-scratch rebuild (forceReingest=true path).
# These feed PipelineRebuildService.ingestOpenAlexBulkIfConfigured(); blank = skip the OpenAlex re-ingest
# (which would leave hostVenueSourceType / venue aggregationType unpopulated). Inputs live under data/openalex/.
core.openalex.bulk.works-file=data/openalex/uvt_works.jsonl
core.openalex.bulk.citers-file=data/openalex/uvt_citing_works.jsonl
core.openalex.bulk.institutions-dir=data/openalex/institutions

# H64 slice 1: brainmap project dump (RO national + FP7 EU tail) -> brainmap.project_facts source collection.
# Produced by scopus-python/brainmap_dump.py. Blank skips. Canonical derivation resolves coordinators into the
# affiliation backbone, so it runs after the Scopus build.
core.brainmap.bulk.projects-file=data/brainmap/uvt_projects.jsonl

# H64 slice 3b: comma-separated Activity names to enable the canonical-project picker on (adds the PROJECT_GRANT_ID
# reference field, additive + idempotent). Blank = inert. Candidates per deployment: Grant Cercetare (physics A9/A10),
# Granturi (CS), FEAA's project activity. e.g. core.projects.reference-activity-names=Grant Cercetare,Granturi
core.projects.reference-activity-names=Grant Cercetare

# H64 slice 4b.3: live CORDIS lookup (public per-project XML export, no auth) for EU project budgets. The admin
# "search CORDIS online" endpoint fetches cordis.europa.eu/project/id/{ID}?format=xml and auto-suggests UVT's
# per-partner ecContribution by matching this legal-name fragment.
core.projects.cordis.base-url=https://cordis.europa.eu
core.projects.cordis.timeout-ms=20000
core.projects.cordis.org-name-match=Universitatea de Vest
# Large CORDIS projects export 300-400KB+ of XML — raise WebClient's 256KB in-memory codec default well above that.
core.projects.cordis.max-bytes=16777216

# H66B Phase 4b — DBLP per-paper conference resolve (keyless public API; replaces the whole-dump streaming).
# DBLP rate-limits a single IP aggressively; throttle politely (a 429 is retried once, then the candidate is skipped
# and re-resolved on the next sweep/sync — forumId stays null so the detector picks it up again).
dblp.api.base-url=https://dblp.org
dblp.api.max-hits=10
dblp.api.min-interval-ms=3000
# Corpus-matched dump sweep (rate-limit-free bulk path; admin-triggered). Point at a downloaded DBLP dump release.
dblp.dump.file=/Users/adispataru/Downloads/dblp-2026-03-01.xml.gz
dblp.dump.version=2026.03.01

# Predatory venue exclusion lists (Beall's, via the maintained stop-predatory-journals project). Standard
# perspective b excludes these from consideration. Matched by exact normalized name; see PredatoryVenueService.
predatory.publishers.file=data/predatory/publishers.csv
predatory.journals.file=data/predatory/journals.csv

# H76: WoS CPCI proceedings Records export (derived from Core Collection records — there is no downloadable CPCI
# master list). Matched to forums by DOI→publication→forum, then ISSN/ISBN, then conference title. See WosCpciOnboardingService.
wos.cpci.file=data/wos/cpci/uvt-proceedings.csv

