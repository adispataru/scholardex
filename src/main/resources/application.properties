spring.application.name=core
spring.config.import=optional:file:.env[.properties]
# H54.2: index creation is owned by MongoIndexReconciler (config/MongoIndexReconciler.java), NOT
# Spring's auto-index-creation. Auto-creation is create-only and aborts startup on any declared-index
# spec change (IndexKeySpecsConflict). The reconciler creates declared indexes AND reconciles
# evolution (drops & rebuilds a stale same-named index). Keep auto-index-creation disabled.
spring.data.mongodb.auto-index-creation=false
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/core}
spring.datasource.username=${POSTGRES_USER:core}
spring.datasource.password=${POSTGRES_PASSWORD:core}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.schemas=reporting_read
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=reporting_read
spring.security.user.name=user
spring.security.user.password=pass
