# Author reconcile (H66B): the fuzzy name+affiliation pass auto-merges STRONG same-name clusters (shared
# co-authors >= coauthor-strong-threshold). Flipped to apply=true 2026-06-19 after a 30/30 spot-check of the
# 896 STRONG candidates (all genuine name-format/encoding/compound-surname variants of one person). MEDIUM
# pairs still quarantine for review. ORCID pass always auto-merges (authoritative).
core.author-reconcile.fuzzy-apply=true
# H72 slice 2: auto-merge Scopus over-split AU-IDs (same name + verified affiliation + ≥1 small-paper co-author;
# co-authors from >20-author papers excluded; common initials-only names go to review, not merged).
core.author-reconcile.affiliation-apply=true
