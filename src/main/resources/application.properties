spring.application.name=core
spring.config.import=optional:file:.env[.properties]
# H54.2: index creation is owned by MongoIndexReconciler (config/MongoIndexReconciler.java), NOT
# Spring's auto-index-creation. Auto-creation is create-only and aborts startup on any declared-index
# spec change (IndexKeySpecsConflict). The reconciler creates declared indexes AND reconciles
# evolution (drops & rebuilds a stale same-named index). Keep auto-index-creation disabled.
spring.data.mongodb.auto-index-creation=false
# Mongo canonical store. Spring Boot 4 binds the URI from `spring.mongodb.uri` (NOT the legacy
# `spring.data.mongodb.uri`, which is inert here — that is why the app silently fell back to db `test`). `.env`
# is imported as a PROPERTIES file (see spring.config.import above), so its key is referenced as a placeholder
# (mirroring spring.datasource.url/${POSTGRES_URL}). Default db is `scholardex` (the real prod db name); set
# SPRING_MONGODB_URI in the environment to point at a prod server.
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/scholardex}
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/core}
spring.datasource.username=${POSTGRES_USER:core}
spring.datasource.password=${POSTGRES_PASSWORD:core}
spring.datasource.driver-class-name=org.postgresql.Driver
# H75: let the PG driver rewrite chunked batchUpdate INSERTs into multi-row INSERT...VALUES(...),(...) — 2-3x
# faster for the projection bulk write. URL-independent so it applies regardless of POSTGRES_URL.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.flyway.enabled=true
spring.flyway.schemas=reporting_read
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.default-schema=reporting_read
spring.security.user.name=user
spring.security.user.password=pass
scholardex.oauth2.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:}
scholardex.oauth2.keycloak.client-id=${KEYCLOAK_CLIENT_ID:}
scholardex.oauth2.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
scholardex.oauth2.keycloak.scopes=${KEYCLOAK_SCOPES:openid,profile,email}
