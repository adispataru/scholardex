<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{authors.meta.title}">Authors</title>
    <meta name="description" content="Search the ScholarDex indexed author catalog by name or affiliation.">
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body class="app-public-page">

<th:block th:replace="~{fragments :: public-shell('authors')}"></th:block>

<main class="app-public-content" id="main-content">
    <div class="app-page-content">
        <div class="app-page-intro">
            <p class="app-page-intro__body" th:text="#{authors.intro}">Browse researchers indexed in ScholarDex</p>
        </div>
        <div class="app-table-filters">
            <h2 class="app-table-filters__title" th:text="#{common.filters}">Filters</h2>
            <div class="app-table-filters__grid">
                <div class="form-group app-table-filters__field app-table-filters__field--span-4">
                    <label for="authors-search" th:text="#{common.search}">Search</label>
                    <th:block th:replace="~{fragments :: search-input(
                        id='authors-search',
                        name='q',
                        placeholder=#{authors.search.placeholder},
                        value='',
                        kbdHint=null,
                        clearable=true)}"></th:block>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="authors-sort" th:text="#{common.sortBy}">Sort By</label>
                    <select id="authors-sort" class="form-control">
                        <option value="name" th:text="#{common.name}">Name</option>
                    </select>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="authors-direction" th:text="#{common.direction}">Direction</label>
                    <select id="authors-direction" class="form-control">
                        <option value="asc" th:text="#{common.ascending}">Ascending</option>
                        <option value="desc" th:text="#{common.descending}">Descending</option>
                    </select>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="authors-size" th:text="#{common.pageSize}">Page Size</label>
                    <select id="authors-size" class="form-control">
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="app-table-section">
            <div class="app-table-section__surface">
                <div class="app-table-section__header app-table-toolbar">
                    <h2 class="app-table-section__title" th:text="#{authors.catalog}">Author Catalog</h2>
                    <span id="authors-total-info" class="app-table-toolbar__meta"></span>
                </div>
                <div class="app-table-section__body">
                    <div id="authors-loading" class="app-table-state app-table-state--info" role="status" th:text="#{authors.loading}">Loading authors...</div>
                    <div id="authors-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                    <div id="authors-empty" class="app-table-state app-table-state--warning d-none" role="status" th:text="#{authors.empty}">No authors found.</div>

                    <div class="app-table-scroll">
                        <table class="table table-bordered app-table" id="authors-table" width="100%" cellspacing="0">
                            <thead>
                            <tr>
                                <th th:text="#{common.name}">Name</th>
                                <th th:text="#{authors.column.affiliations}">Affiliations</th>
                            </tr>
                            </thead>
                            <tbody id="authors-table-body"></tbody>
                        </table>
                    </div>

                    <div class="app-table-pager">
                        <button id="authors-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button" th:text="#{common.previous}">Previous</button>
                        <span id="authors-page-info" class="app-table-pager__info"></span>
                        <button id="authors-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button" th:text="#{common.next}">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: app-footer}"></th:block>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/authors.js"></script>

</body>
</html>
