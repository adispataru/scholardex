<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categoryDetail.categoryName() + ' (' + categoryDetail.edition() + ') — WoS Category'}">WoS Category</title>
    <meta name="description"
          th:content="${'Web of Science category profile for ' + categoryDetail.categoryName() + ' (' + categoryDetail.edition() + ') with indexed journals and coverage metadata.'}">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${categoryDetail.categoryName() + ' (' + categoryDetail.edition() + ') — WoS Category'}">
    <meta property="og:description"
          th:content="${'Browse journal coverage for the ' + categoryDetail.categoryName() + ' WoS category.'}">
    <meta property="og:url" th:content="@{/wos/categories/{key}(key=${categoryDetail.key()})}">
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('rankings')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('WoS Category')}"></div>
            <div class="container-fluid app-page-content">
                <th:block th:replace="~{fragments :: breadcrumb(${breadcrumbs}, 'default')}"></th:block>

                <section aria-labelledby="wos-category-title">
                    <div class="app-university-detail__section-header">
                        <div>
                            <p class="app-university-detail__eyebrow" th:text="'WoS category — ' + ${categoryDetail.edition()}">WoS Category</p>
                            <h1 id="wos-category-title" class="app-university-detail__section-title" th:text="${categoryDetail.categoryName()}">Category Name</h1>
                        </div>
                        <a href="/rankings#wos" class="btn btn-outline-primary btn-sm">
                            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                            <span>All categories</span>
                        </a>
                    </div>
                </section>

                <div class="app-summary-grid mb-4">
                    <th:block th:replace="~{fragments :: stat-card(
                        label='Journals',
                        value=${categoryDetail.journalCount()},
                        accent='primary',
                        contextLine='Indexed in this category',
                        icon='fa-solid fa-book-open')}"></th:block>
                    <th:block th:replace="~{fragments :: stat-card(
                        label='Edition',
                        value=${categoryDetail.edition()},
                        accent='neutral',
                        contextLine='WoS edition',
                        icon='fa-solid fa-layer-group')}"></th:block>
                    <th:block th:replace="~{fragments :: stat-card(
                        label='Latest Year',
                        value=${categoryDetail.latestYear() != null ? categoryDetail.latestYear() : '—'},
                        accent='neutral',
                        contextLine='Most recent data year',
                        icon='fa-solid fa-calendar')}"></th:block>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                        <div class="app-table-section__header">
                            <h2 class="app-table-section__title">Journal Coverage</h2>
                        </div>
                        <div class="app-table-section__body">
                            <div th:if="${#lists.isEmpty(categoryDetail.journals())}"
                                 class="app-table-state app-table-state--warning" role="status">
                                No journals are currently linked to this WoS category.
                            </div>
                            <div th:if="${!#lists.isEmpty(categoryDetail.journals())}" class="app-table-scroll">
                                <table class="table table-bordered app-table" id="wos-category-detail-table" width="100%" cellspacing="0">
                                    <thead>
                                    <tr>
                                        <th>Journal</th>
                                        <th>ISSN</th>
                                        <th>eISSN</th>
                                        <th>Latest Year</th>
                                        <th>AIS Quarter</th>
                                        <th>RIS Quarter</th>
                                        <th>IF Quarter</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="journal : ${categoryDetail.journals()}">
                                        <td><a th:href="@{/forums/{id}(id=${journal.journalId()})}" th:text="${journal.journalName()}">Journal Name</a></td>
                                        <td class="app-table__cell--identifier" th:text="${journal.issn() != null ? journal.issn() : '—'}">—</td>
                                        <td class="app-table__cell--identifier" th:text="${journal.eIssn() != null ? journal.eIssn() : '—'}">—</td>
                                        <td th:text="${journal.latestYear() != null ? journal.latestYear() : '—'}">—</td>
                                        <td th:text="${journal.latestAisQuarter() != null ? journal.latestAisQuarter() : '—'}">—</td>
                                        <td th:text="${journal.latestRisQuarter() != null ? journal.latestRisQuarter() : '—'}">—</td>
                                        <td th:text="${journal.latestIfQuarter() != null ? journal.latestIfQuarter() : '—'}">—</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>

</body>
</html>
