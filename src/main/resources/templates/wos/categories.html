<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>WoS Categories</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('rankings-categories')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('WoS Categories')}"></div>
            <div class="container-fluid app-page-content">
                <p class="mb-4">Browse the current Web of Science category sets used by journal detail pages.</p>

                <div class="app-table-filters">
                    <h6 class="app-table-filters__title">Filters</h6>
                        <div class="app-table-filters__grid">
                            <div class="form-group app-table-filters__field app-table-filters__field--span-5">
                                <label for="wos-categories-search">Search</label>
                                <input id="wos-categories-search" type="text" class="form-control" placeholder="Category name or edition">
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="wos-categories-sort">Sort By</label>
                                <select id="wos-categories-sort" class="form-control">
                                    <option value="categoryName">Category</option>
                                    <option value="edition">Edition</option>
                                    <option value="journalCount">Journals</option>
                                    <option value="latestYear">Latest Year</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="wos-categories-direction">Direction</label>
                                <select id="wos-categories-direction" class="form-control">
                                    <option value="asc">Ascending</option>
                                    <option value="desc">Descending</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="wos-categories-size">Page Size</label>
                                <select id="wos-categories-size" class="form-control">
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title">Category Directory</h6>
                        <span id="wos-categories-total-info" class="app-table-toolbar__meta"></span>
                    </div>
                    <div class="app-table-section__body">
                        <div id="wos-categories-loading" class="app-table-state app-table-state--info" role="status">Loading categories...</div>
                        <div id="wos-categories-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                        <div id="wos-categories-empty" class="app-table-state app-table-state--warning d-none" role="status">No WoS categories found for the current filter.</div>

                        <div class="app-table-scroll">
                            <table class="table table-bordered app-table" id="wos-categories-table" data-detail-base="/wos/categories" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Edition</th>
                                    <th>Journals</th>
                                    <th>Latest Year</th>
                                </tr>
                                </thead>
                                <tbody id="wos-categories-table-body"></tbody>
                            </table>
                        </div>

                        <div class="app-table-pager">
                            <button id="wos-categories-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Previous</button>
                            <span id="wos-categories-page-info" class="app-table-pager__info"></span>
                            <button id="wos-categories-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Next</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/rankings-categories.js"></script>

</body>
</html>
