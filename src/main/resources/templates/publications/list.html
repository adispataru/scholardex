<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{publications.meta.title}">Publications</title>
    <meta name="description" content="Search the ScholarDex indexed publication catalog by title, author, or venue.">
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body class="app-public-page">

<th:block th:replace="~{fragments :: public-shell('publications')}"></th:block>

<main class="app-public-content" id="main-content">
    <div class="app-page-content">
        <div class="app-page-intro">
            <p class="app-page-intro__body" th:text="#{publications.intro}">Browse scholarly publications indexed in</p>
        </div>
        <div class="app-table-filters">
            <h2 class="app-table-filters__title" th:text="#{common.filters}">Filters</h2>
            <div class="app-table-filters__grid">
                <div class="form-group app-table-filters__field app-table-filters__field--span-4">
                    <label for="publications-search" th:text="#{common.search}">Search</label>
                    <th:block th:replace="~{fragments :: search-input(
                        id='publications-search',
                        name='q',
                        placeholder=#{publications.search.placeholder},
                        value='',
                        kbdHint=null,
                        clearable=true)}"></th:block>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="publications-sort" th:text="#{common.sortBy}">Sort By</label>
                    <select id="publications-sort" class="form-control">
                        <option value="title" th:text="#{common.title}">Title</option>
                        <option value="year" th:text="#{common.year}">Year</option>
                        <option value="citations" th:text="#{common.citations}">Citations</option>
                    </select>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="publications-direction" th:text="#{common.direction}">Direction</label>
                    <select id="publications-direction" class="form-control">
                        <option value="asc" th:text="#{common.ascending}">Ascending</option>
                        <option value="desc" th:text="#{common.descending}">Descending</option>
                    </select>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="publications-size" th:text="#{common.pageSize}">Page Size</label>
                    <select id="publications-size" class="form-control">
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="app-table-section">
            <div class="app-table-section__surface">
                <div class="app-table-section__header app-table-toolbar">
                    <h2 class="app-table-section__title" th:text="#{publications.catalog}">Publication Catalog</h2>
                    <span id="publications-total-info" class="app-table-toolbar__meta"></span>
                </div>
                <div class="app-table-section__body">
                    <div id="publications-loading" class="app-table-state app-table-state--info" role="status" th:text="#{publications.loading}">Loading publications...</div>
                    <div id="publications-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                    <div id="publications-empty" class="app-table-state app-table-state--warning d-none" role="status" th:text="#{publications.empty}">No publications found.</div>

                    <div class="app-table-scroll">
                        <table class="table table-bordered app-table" id="publications-table" width="100%" cellspacing="0">
                            <thead>
                            <tr>
                                <th th:text="#{common.title}">Title</th>
                                <th th:text="#{common.year}">Year</th>
                                <th th:text="#{publications.column.forum}">Forum</th>
                                <th th:text="#{publications.column.authors}">Authors</th>
                                <th class="app-table__cell--numeric" th:text="#{common.citations}">Citations</th>
                                <th>EID</th>
                            </tr>
                            </thead>
                            <tbody id="publications-table-body"></tbody>
                        </table>
                    </div>

                    <div class="app-table-pager">
                        <button id="publications-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button" th:text="#{common.previous}">Previous</button>
                        <span id="publications-page-info" class="app-table-pager__info"></span>
                        <button id="publications-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button" th:text="#{common.next}">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: app-footer}"></th:block>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/publications.js"></script>

</body>
</html>
