<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top" class="app-error-body"
      th:with="errorStatus='404',
               errorTitle='Page not found',
               errorLead='The requested record or page could not be found.',
               errorMessage='It may have moved, been removed, or the address may be mistyped. Try searching from the forum directory or browse another ranking area.',
               errorIcon='fa-solid fa-magnifying-glass',
               errorTone='primary',
               errorPath=${#httpServletRequest != null ? #httpServletRequest.requestURI : ''},
               errorTimestamp='',
               errorRequestId='',
               errorShowRetry=false,
               errorShowBrowseLinks=true,
               errorActiveSection='scholardex-forums',
               errorPrimaryHref='/forums',
               errorPrimaryLabel='Browse forums'">
<th:block th:replace="~{fragments :: error-page}"></th:block>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>
</body>
</html>
