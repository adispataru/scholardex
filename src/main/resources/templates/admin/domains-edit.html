<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Domains</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments :: sidebar('domains')}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            <!-- Topbar -->
            <div th:replace="~{fragments :: navbar('Edit Domain')}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid app-page-content">
                <div class="app-workflow">
                    <p class="app-workflow__intro">Update the domain details and manage the WoS categories assigned to it.</p>
                    <div class="app-form-surface">
                        <div class="app-form-surface__panel">
                            <div class="app-form-surface__header">
                                <h6 class="app-form-surface__title">Update Domain</h6>
                            </div>
                            <div class="app-form-surface__body">
                                <form th:action="@{/admin/domains/update}" th:object="${domain}" method="post">
                                    <div class="app-form-section mb-3">
                                        <div class="app-form-section__header">
                                            <h6 class="app-form-section__title" th:text="${domain.name}"></h6>
                                            <p class="app-form-section__description">Keep the taxonomy name and description aligned with the categories below.</p>
                                        </div>
                                        <div class="app-form-grid">
                                            <div class="form-group app-form-field">
                                                <label for="domainName">Name</label>
                                                <input type="text" class="form-control" id="domainName" th:field="*{name}" required>
                                            </div>
                                            <div class="form-group app-form-field">
                                                <label for="domainDescription">Description</label>
                                                <input type="text" class="form-control" id="domainDescription" th:field="*{description}" required>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group app-form-field app-form-section">
                                        <div class="app-form-section__header">
                                            <h6 class="app-form-section__title">WoS Categories</h6>
                                        </div>
                                        <label for="wosCategories">WOS Categories</label>
                                        <div id="wosCategoriesContainer" class="app-collection">
                                            <div class="input-group mb-2 app-collection__item" th:each="category, iterStat : *{wosCategories}">
                                                <select class="form-control" th:field="*{wosCategories[__${iterStat.index}__]}" th:selected="${category}">
                                                    ${allWosCategories.map(category => `<option th:value="${category}" th:text="${category}"></option>`)}
                                                </select>
                                                <button class="btn btn-danger remove-category" type="button">Remove</button>
                                            </div>
                                        </div>
                                        <div class="app-form-actions app-form-actions--inline">
                                            <button id="addCategory" class="btn btn-primary" type="button">Add Category</button>
                                        </div>
                                    </div>
                                    <div class="app-form-actions">
                                        <button type="submit" class="btn btn-primary">Update</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <div th:replace="~{fragments :: app-footer}"></div>
            <!-- End of Footer -->
        </div>
        <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>

<!-- Bootstrap core JavaScript-->
<th:block th:replace="~{fragments :: core-scripts}"></th:block>

<!-- Page level plugins -->


<script th:inline="javascript">
    $(document).ready(function() {
        // Ensure Thymeleaf processes this part correctly
        var allWosCategories = /*[[${allWosCategories}]]*/ [];
        let wosCategoriesContainer = $('#wosCategoriesContainer');

        $('#addCategory').click(function() {
            let index = wosCategoriesContainer.children().length;
            let categoryTemplate = `
                <div class="input-group mb-2 app-collection__item">
                    <select class="form-control" name="wosCategories[${index}]">
                        ${allWosCategories.map(category => `<option value="${category}">${category}</option>`).join('')}
                    </select>
                    <button class="btn btn-danger remove-category" type="button">Remove</button>
                </div>`;
            wosCategoriesContainer.append(categoryTemplate);
        });

        wosCategoriesContainer.on('click', '.remove-category', function() {
            $(this).closest('.input-group').remove();
            // Optionally, update the indices of the remaining elements
            wosCategoriesContainer.children().each(function(index, element) {
                $(element).find('select').attr('name', `wosCategories[${index}]`);
            });
        });
    });
</script>
</body>
</html>
