<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Publications</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('scholardex-publications')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Publications')}"></div>
            <div class="container-fluid app-page-content">
                <form th:action="@{/admin/scholardex/publications/search}" method="get">
                    <div class="form-group">
<!--                        <label for="authorName">Author Name</label>-->
                        <input type="text" class="form-control" id="authorName" name="authorName" hidden="hidden">
                    </div>
                    <div class="form-group">
                        <label for="paperTitle">Paper Title</label>
                        <input type="text" class="form-control" id="paperTitle" name="paperTitle">
                    </div>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </div>
        </div>
        <div th:replace="~{fragments :: app-footer}"></div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>


</body>
</html>
