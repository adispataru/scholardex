<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Publications</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('scholardex-publications')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Publications')}"></div>
            <div class="container-fluid app-page-content">
                <div class="app-dashboard">
                    <th:block th:replace="~{fragments :: stat-card-grid(${statCards})}"></th:block>

                    <!-- Bulk operation feedback -->
                    <div th:if="${bulkSuccess}" class="app-form-state app-form-state--success" th:text="${bulkSuccess}"></div>
                    <div th:if="${bulkError}" class="app-form-state app-form-state--danger" th:text="${bulkError}"></div>

                    <!-- Active filter context banner -->
                    <div th:if="${filterContextLabel}" class="app-feedback app-feedback--info" style="margin-bottom:0.5rem;">
                        <i class="fa-solid fa-filter fa-xs"></i>
                        Filtering by <strong th:text="${filterContextLabel}"></strong> —
                        <a th:href="@{/admin/scholardex/publications}">Clear filter</a>
                    </div>

                    <input form="publication-filter-form" type="hidden" name="forumId" th:value="${forumId}" th:if="${!#strings.isEmpty(forumId)}">
                    <input form="publication-filter-form" type="hidden" name="authorId" th:value="${authorId}" th:if="${!#strings.isEmpty(authorId)}">
                    <input form="publication-filter-form" type="hidden" name="affiliationId" th:value="${affiliationId}" th:if="${!#strings.isEmpty(affiliationId)}">
                    <th:block th:replace="~{fragments :: filter-panel(
                        formId='publication-filter-form',
                        method='get',
                        action=@{/admin/scholardex/publications},
                        fields=${filterFields})}">
                    </th:block>

                    <!-- Bulk select bar (hidden until selection) -->
                    <div id="pub-bulk-bar" class="app-bulk-select-bar d-none" style="margin-top:0.5rem;">
                        <span class="app-bulk-select-bar__count">
                            <span id="pub-bulk-count">0 items</span> selected
                        </span>
                        <div class="app-bulk-select-bar__actions">
                            <button type="button" class="btn btn-sm btn-primary"
                                    data-toggle="modal" data-target="#reassignForumModal">
                                <i class="fa-solid fa-arrow-right-arrow-left fa-xs"></i> Reassign Forum
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="pub-bulk-clear">
                                Clear selection
                            </button>
                        </div>
                    </div>

                    <!-- Publications table -->
                    <div class="app-table-section">
                        <div class="app-table-section__surface" style="border-top-left-radius:0;border-top-right-radius:0;">
                            <div class="app-table-section__header app-table-toolbar">
                                <h6 class="app-table-section__title">
                                    Publications
                                    <span class="text-muted" style="font-weight:400;font-size:0.82rem;"
                                          th:text="'— ' + ${catalogPage.total()} + ' total'"></span>
                                </h6>
                                <div class="app-table-toolbar__actions" id="pub-toolbar-actions">
                                    <th:block th:with="prevUrl=${catalogPage.hasPrevious()} ? @{/admin/scholardex/publications(q=${q},forumId=${forumId},authorId=${authorId},affiliationId=${affiliationId},page=${catalogPage.page()-1},size=${size},sort=${sort},direction=${direction})} : null,
                                                       nextUrl=${catalogPage.hasNext()} ? @{/admin/scholardex/publications(q=${q},forumId=${forumId},authorId=${authorId},affiliationId=${affiliationId},page=${catalogPage.page()+1},size=${size},sort=${sort},direction=${direction})} : null">
                                        <th:block th:replace="~{fragments :: pagination(${prevUrl}, ${nextUrl}, ${catalogPage.page()}, ${catalogPage.totalPages()}, null, 'Publications catalog pagination')}"></th:block>
                                    </th:block>
                                </div>
                            </div>
                            <div class="app-table-section__body">
                                <div class="app-table-scroll">
                                    <table class="table app-table" id="pub-table">
                                        <thead>
                                        <tr>
                                            <th data-col="select" style="width:2.2rem;">
                                                <input type="checkbox" id="pub-select-all" class="js-bulk-select-all"
                                                       title="Select all on this page">
                                            </th>
                                            <th data-col="title">Title</th>
                                            <th data-col="authors">Authors</th>
                                            <th data-col="forum">Forum</th>
                                            <th data-col="year">Year</th>
                                            <th data-col="citations">Citations</th>
                                            <th data-col="overrides">Overrides</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="pub : ${catalogPage.content()}">
                                            <td data-col="select">
                                                <input type="checkbox" class="js-pub-bulk-cb"
                                                       th:value="${pub.id}" aria-label="Select publication">
                                            </td>
                                            <td data-col="title" class="text-truncate" style="max-width:22rem;">
                                                <a th:href="@{/admin/scholardex/publications/citations(id=${pub.id})}"
                                                   th:text="${pub.title}"
                                                   th:title="${pub.title}">Title</a>
                                            </td>
                                            <td data-col="authors">
                                                <span th:each="authorId, iterStat : ${pub.authors}">
                                                    <th:block th:with="author=${catalogPage.authorMap()[authorId]}">
                                                        <a th:if="${author != null}"
                                                           th:href="@{/admin/scholardex/publications(authorId=${authorId})}"
                                                           th:text="${author.name}"
                                                           class="app-catalog-link"></a>
                                                        <span th:if="${author == null}" class="text-muted" th:text="${authorId}"></span>
                                                        <span th:if="${!iterStat.last}">, </span>
                                                    </th:block>
                                                </span>
                                            </td>
                                            <td data-col="forum">
                                                <th:block th:with="forum=${catalogPage.forumMap()[pub.forum]}">
                                                    <a th:if="${forum != null}"
                                                       th:href="@{/admin/scholardex/publications(forumId=${pub.forum})}"
                                                       th:text="${forum.publicationName}"
                                                       class="app-catalog-link"></a>
                                                    <span th:if="${forum == null}" class="text-muted">—</span>
                                                </th:block>
                                            </td>
                                            <td data-col="year" th:text="${pub.coverDate != null ? #strings.substring(pub.coverDate, 0, 4) : '—'}">—</td>
                                            <td data-col="citations" th:text="${pub.citedbyCount}">0</td>
                                            <td data-col="overrides">
                                                <th:block th:with="summary=${catalogPage.decisionSummaryByPublicationId()[pub.id]}">
                                                    <span th:if="${summary == null}" class="text-muted">—</span>
                                                    <span th:if="${summary != null}"
                                                          th:text="${summary.confirmedCount + '✓ / ' + summary.rejectedCount + '✗'}"
                                                          class="text-muted small"></span>
                                                </th:block>
                                            </td>
                                        </tr>
                                        <!-- Empty state -->
                                        <tr th:if="${catalogPage.content().isEmpty()}" class="app-admin-empty-row">
                                            <td colspan="7">
                                                <th:block th:replace="~{fragments :: admin-empty-state(
                                                    'No publications found',
                                                    'Try adjusting the search or filters above.',
                                                    null,
                                                    null)}"></th:block>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom pagination bar -->
                    <th:block th:if="${catalogPage.total() > 0}"
                              th:with="showText=|Showing ${catalogPage.content().size()} of ${catalogPage.total()} publications|,
                                       prevUrl=${catalogPage.hasPrevious()} ? @{/admin/scholardex/publications(q=${q},forumId=${forumId},authorId=${authorId},affiliationId=${affiliationId},page=${catalogPage.page()-1},size=${size},sort=${sort},direction=${direction})} : null,
                                       nextUrl=${catalogPage.hasNext()} ? @{/admin/scholardex/publications(q=${q},forumId=${forumId},authorId=${authorId},affiliationId=${affiliationId},page=${catalogPage.page()+1},size=${size},sort=${sort},direction=${direction})} : null">
                        <th:block th:replace="~{fragments :: pagination(${prevUrl}, ${nextUrl}, ${catalogPage.page()}, ${catalogPage.totalPages()}, ${showText}, 'Publications catalog pagination')}"></th:block>
                    </th:block>
                </div>
            </div>
            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>
</div>
<!-- Reassign Forum modal -->
<th:block th:replace="~{fragments :: modal-shell(
    id='reassignForumModal',
    title='Reassign Forum',
    size='',
    bodySlot=~{::#reassign-forum-modal-body},
    footerSlot=~{::#reassign-forum-modal-footer})}">
    <th:block id="reassign-forum-modal-body">
            <form id="pub-bulk-form" method="post"
                  th:action="@{/admin/scholardex/publications/bulk/reassign-forum}">
                <input type="hidden" name="q" th:value="${q}">
                <input type="hidden" name="forumId" th:value="${forumId}">
                <input type="hidden" name="authorId" th:value="${authorId}">
                <input type="hidden" name="affiliationId" th:value="${affiliationId}">
                <input type="hidden" name="page" th:value="${catalogPage.page()}">
                <input type="hidden" name="size" th:value="${size}">
                <input type="hidden" name="sort" th:value="${sort}">
                <input type="hidden" name="direction" th:value="${direction}">
                    <p class="text-muted small mb-2">Selected publications will be assigned to the forum below.</p>
                    <div class="form-group">
                        <label for="reassign-forum-input" class="font-weight-bold" style="font-size:0.84rem;">Forum ID</label>
                        <input id="reassign-forum-input" type="text" name="newForumId"
                               class="form-control form-control-sm"
                               placeholder="Enter Scopus forum ID…" required autocomplete="off">
                        <small class="form-text text-muted">Enter the Scopus source ID for the target forum.</small>
                    </div>
            </form>
    </th:block>
    <th:block id="reassign-forum-modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-dismiss="modal">Cancel</button>
        <button type="submit" form="pub-bulk-form" class="btn btn-primary btn-sm">Reassign</button>
    </th:block>
</th:block>

<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script th:inline="javascript">
(function () {
    var fp = /*[[${q + '|' + forumId + '|' + authorId + '|' + affiliationId}]]*/ '';
    var bulk = window.initAdminBulkSelect({
        tableKey: 'publications',
        fingerprint: fp,
        cbSelector: '.js-pub-bulk-cb',
        selectAllSelector: '#pub-select-all',
        barSelector: '#pub-bulk-bar',
        countSelector: '#pub-bulk-count',
        bulkFormId: 'pub-bulk-form',
        inputName: 'publicationId',
    });
    document.getElementById('pub-bulk-clear').addEventListener('click', function () {
        bulk.clearAll();
    });
    window.initAdminColumnToggle({
        tableId: 'publications',
        tableEl: document.getElementById('pub-table'),
        toolbarActionsEl: document.getElementById('pub-toolbar-actions'),
        columns: [
            { key: 'select',    label: 'Select',    required: true },
            { key: 'title',     label: 'Title',     required: true },
            { key: 'authors',   label: 'Authors',   required: false },
            { key: 'forum',     label: 'Forum',     required: false },
            { key: 'year',      label: 'Year',      required: false },
            { key: 'citations', label: 'Citations', required: false },
            { key: 'overrides', label: 'Overrides', required: false },
        ],
    });

    var pubTbody = document.querySelector('#pub-table tbody');
    if (pubTbody) {
        window.initAdminShortcuts({
            sections: [{
                title: 'Row Actions',
                rows: [{ keys: ['e', 'Enter'], label: 'Open citations for focused publication' }],
            }],
            tables: [{
                tbodyEl: pubTbody,
                keyActions: {
                    'e':     function(tr) { var a = tr.querySelector('[data-col="title"] a'); if (a) window.location.href = a.href; },
                    'Enter': function(tr) { var a = tr.querySelector('[data-col="title"] a'); if (a) window.location.href = a.href; },
                },
            }],
        });
    }
})();
</script>
</body>
</html>
