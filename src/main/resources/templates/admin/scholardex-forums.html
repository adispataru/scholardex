<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Scholardex Forums</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('scholardex-forums')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Scholardex Forums')}"></div>

            <div class="container-fluid app-page-content">
                <div class="app-page-toolbar">
                    <button id="exportButton" class="btn btn-primary btn-sm">Export to Excel</button>
                </div>
                <p class="mb-4">This is a list of all canonical forums currently managed by the system, including WoS-linked journals and non-WoS venues.</p>

                <div class="app-table-filters">
                    <h6 class="app-table-filters__title">Filters</h6>
                        <div class="app-table-filters__grid">
                            <div class="form-group app-table-filters__field app-table-filters__field--span-5">
                                <label for="admin-forums-search">Search</label>
                                <input id="admin-forums-search" type="text" class="form-control" placeholder="Publication name, ISSN, eISSN, aggregation type">
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="admin-forums-sort">Sort By</label>
                                <select id="admin-forums-sort" class="form-control">
                                    <option value="publicationName">Publication Name</option>
                                    <option value="issn">ISSN</option>
                                    <option value="eIssn">eISSN</option>
                                    <option value="aggregationType">Aggregation Type</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="admin-forums-direction">Direction</label>
                                <select id="admin-forums-direction" class="form-control">
                                    <option value="asc">Ascending</option>
                                    <option value="desc">Descending</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="admin-forums-wos">WoS Status</label>
                                <select id="admin-forums-wos" class="form-control">
                                    <option value="all">All</option>
                                    <option value="indexed">WoS indexed</option>
                                    <option value="not_indexed">Not indexed by WoS</option>
                                    <option value="not_applicable">Not applicable</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-1">
                                <label for="admin-forums-size">Page Size</label>
                                <select id="admin-forums-size" class="form-control">
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title">Detailed View of Forums</h6>
                        <span id="admin-forums-total-info" class="app-table-toolbar__meta"></span>
                    </div>
                    <div class="app-table-section__body">
                        <div id="admin-forums-loading" class="app-table-state app-table-state--info" role="status">Loading forums...</div>
                        <div id="admin-forums-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                        <div id="admin-forums-empty" class="app-table-state app-table-state--warning d-none" role="status">No forums found for the current filter.</div>

                        <div class="app-table-scroll">
                            <table class="table app-table" id="admin-forums-table" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Publication Name</th>
                                    <th>ISSN</th>
                                    <th>eISSN</th>
                                    <th>Aggregation Type</th>
                                    <th>WoS Status</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody id="admin-forums-table-body"></tbody>
                            </table>
                        </div>

                        <div class="app-table-pager">
                            <button id="admin-forums-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Previous</button>
                            <span id="admin-forums-page-info" class="app-table-pager__info"></span>
                            <button id="admin-forums-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Next</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>

<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/admin-scholardex-forums.js"></script>

</body>
</html>
