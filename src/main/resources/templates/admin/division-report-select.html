<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{orgunit.select.meta.title(${division.name})}">Select reports</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('divisions')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar(#{orgunit.select.meta.title(${division.name})})}"></div>
            <div class="container-fluid app-page-content">
                <div class="app-page-toolbar app-workflow">
                    <p class="app-workflow__intro" th:text="#{orgunit.select.intro(${division.name})}">
                        Pick which individual reports apply to this division.
                    </p>
                    <div class="app-workflow__actions">
                        <a th:href="${backHref}" class="btn btn-outline-secondary btn-sm" th:text="#{orgunit.select.back}">← Reports</a>
                    </div>
                </div>

                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                        <div class="app-table-section__body">
                            <div class="app-table-scroll">
                                <table class="table app-table">
                                    <thead>
                                    <tr>
                                        <th style="width:1%; white-space:nowrap;" th:text="#{orgunit.select.col.selected}">Selected</th>
                                        <th th:text="#{orgunit.col.title}">Title</th>
                                        <th th:text="#{orgunit.col.description}">Description</th>
                                        <th th:text="#{orgunit.col.criteria}">Criteria</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="r : ${catalog}">
                                        <td>
                                            <form th:action="${postUrl}" method="post" style="margin:0;">
                                                <input type="hidden" name="reportId" th:value="${r.id}">
                                                <input type="hidden" name="selected"
                                                       th:value="${selectedIds.contains(r.id) ? 'false' : 'true'}">
                                                <button type="submit"
                                                        class="btn btn-sm"
                                                        th:classappend="${selectedIds.contains(r.id) ? 'btn-success' : 'btn-outline-secondary'}"
                                                        th:text="${selectedIds.contains(r.id)} ? #{orgunit.select.on} : #{orgunit.select.off}">Off</button>
                                            </form>
                                        </td>
                                        <td th:text="${r.title}">Report</td>
                                        <td th:text="${r.description}"></td>
                                        <td th:text="${r.criteria != null ? #lists.size(r.criteria) : 0}"></td>
                                    </tr>
                                    <tr th:if="${catalog.isEmpty()}" class="app-admin-empty-row">
                                        <td colspan="4">
                                            <th:block th:replace="~{fragments :: admin-empty-state(
                                                #{orgunit.select.empty.title},
                                                #{orgunit.select.empty.body},
                                                '', '')}"></th:block>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments :: core-scripts}"></th:block>
</body>
</html>
