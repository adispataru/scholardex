<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments :: sidebar('users')}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            <!-- Topbar -->
            <div th:replace="~{fragments :: navbar('Users')}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid app-page-content">
                <div class="app-page-toolbar app-workflow">
                    <p class="app-workflow__intro">Manage platform access, create new accounts, and update roles from one place.</p>
                    <div class="app-workflow__actions">
                        <button type="button" class="btn btn-primary btn-sm" data-toggle="modal" data-target="#createUserModal">
                            New User
                        </button>
                    </div>

                    <!-- Create User Modal -->
                    <div class="modal fade app-modal" id="createUserModal" tabindex="-1" aria-labelledby="createUserModalLabel" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="createUserModalLabel">New User</h5>
                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>
                                <form th:action="@{/admin/users/create}" method="post">
                                    <div class="modal-body">
                                        <div class="app-form-section">
                                            <div class="app-form-section__header">
                                                <h6 class="app-form-section__title">Identity</h6>
                                                <p class="app-form-section__description">Set the core credentials for the new account before assigning permissions.</p>
                                            </div>
                                            <div class="app-form-grid app-form-grid--two-up">
                                        <!-- Email Input -->
                                        <div class="form-group app-form-field">
                                            <label for="user-email">Email</label>
                                            <input type="email" class="form-control" id="user-email" name="email" required>
                                        </div>
                                        <!-- Password Input -->
                                        <div class="form-group app-form-field">
                                            <label for="user-password">Password</label>
                                            <input type="password" class="form-control" id="user-password" name="password" required>
                                        </div>
                                            </div>
                                        </div>
                                        <!-- Role Selection, adjust based on your Role entity -->
                                        <!-- Role Selection, adjusted for multiple selection -->
                                        <div class="form-group app-form-field app-form-section mt-3">
                                            <div class="app-form-section__header">
                                            <span class="app-form-label">Roles</span>
                                            <p class="app-form-help mb-0">Select one or more roles for the new user.</p>
                                            </div>
                                            <!--                                <label for="user-roles">Roles</label>-->
                                            <!--                                <select class="form-control" id="user-roles" name="roles" multiple>-->
                                            <!--                                    <option value="RESEARCHER">RESEARCHER</option>-->
                                            <!--                                    <option value="SUPERVISOR">SUPERVISOR</option>-->
                                            <!--                                    <option value="PLATFORM_ADMIN">PLATFORM_ADMIN</option>-->
                                            <!--                                </select>-->
                                            <!--                                <input type="hidden" name="email" th:value="${user.email}" />-->
                                            <div class="app-form-choice-list">
                                            <label class="app-form-choice" th:each="role, roleStat : ${allRoles}">
                                                <input type="checkbox" th:name="roles" th:value="${role}" />
                                                <span class="app-form-choice__body">
                                                    <span class="app-form-choice__label" th:text="${role}"></span>
                                                    <span class="app-form-choice__meta">Grant this permission set when the account is created.</span>
                                                </span>
                                            </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="modal-footer app-form-actions">
                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                        <button type="submit" class="btn btn-primary">Create User</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title">User Management</h6>
                    </div>
                    <div class="app-table-section__body">
                        <div class="table-responsive">
                            <table class="table table-bordered js-datatable app-table" id="dataTable" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Email</th>
                                    <th>Roles</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.email}"></td>
                                    <td>
                                        <form th:action="@{/admin/users/updateRoles}" method="post">
                                            <input type="hidden" name="email" th:value="${user.email}" />
                                            <div th:each="role, roleStat : ${allRoles}">
                                                <input type="checkbox" th:name="roles" th:value="${role}"
                                                       th:checked="${#lists.contains(user.roles, role)}" />
                                                <label th:text="${role}"></label>
                                            </div>
                                            <button type="submit" class="btn btn-info btn-sm">Update Roles</button>
                                        </form>
                                    </td>
                                    <td>
                                        <form th:action="@{/admin/users/lock/{email}(email=${user.email})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-warning btn-sm">Lock</button>
                                        </form>
                                        <form th:action="@{/admin/users/delete/{email}(email=${user.email})}" method="post" style="display:inline;">
                                            <input type="hidden" name="_method" value="delete" />
                                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <div th:replace="~{fragments :: app-footer}"></div>
            <!-- End of Footer -->
        </div>
        <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>

<!-- Bootstrap core JavaScript-->
<th:block th:replace="~{fragments :: core-scripts}"></th:block>

<!-- Page level plugins -->

<!-- Page level custom scripts -->

</body>
</html>
