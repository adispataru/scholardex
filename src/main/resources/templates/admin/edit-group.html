<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Group</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments :: sidebar('groups')}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Edit Group')}"></div>
            <div class="container-fluid app-page-content">
                <div class="app-workflow">
                    <th:block th:replace="~{fragments :: admin-breadcrumb(${breadcrumbs})}"></th:block>
                    <p class="app-workflow__intro">Edit the group and its relationships in one workflow surface with shared sections for identity, domains, institution, and researchers.</p>

                        <form th:with="adminFormObject=${group}"
                              th:replace="~{fragments :: admin-form(
                                  id='group-admin-form',
                                  action=@{/admin/groups/update},
                                  method='post',
                                  title='Edit Group',
                                  sections=~{::#group-form-sections},
                                  submitLabel='Update',
                                  cancelHref=@{/admin/groups})}">
                            <th:block id="group-form-sections">
                            <input type="hidden" class="form-control" id="groupId" th:field="*{id}" required>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Group profile',
                                helperText='Keep the group identity concise and recognizable for workspace and report contexts.',
                                body=~{::#group-profile-fields})}">
                                <div id="group-profile-fields" class="app-form-grid">
                                    <div class="form-group app-form-field">
                                        <label for="groupName">Name</label>
                                        <input type="text" class="form-control" id="groupName" th:field="*{name}" required>
                                    </div>
                                    <div class="form-group app-form-field">
                                        <label for="groupDescription">Description</label>
                                        <textarea class="form-control" id="groupDescription" th:field="*{description}" required></textarea>
                                    </div>
                                </div>
                            </th:block>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Domains',
                                helperText='Assign the evaluation domains this group participates in.',
                                body=~{::#group-domain-fields})}">
                            <div id="group-domain-fields" class="app-form-field">
                                <label for="groupDomains">Domains</label>
                                <div id="domainsContainer" class="app-collection">
                                    <div class="input-group mb-2 app-collection__item" th:each="domainId, iterStat : *{domainIds}">
                                        <select class="form-control" th:field="*{domainIds[__${iterStat.index}__]}">
                                            <option th:each="domain : ${allDomains}" th:value="${domain.id}" th:text="${domain.name}"></option>
                                        </select>
                                        <button class="btn btn-danger remove-domain" type="button">Remove</button>
                                    </div>
                                </div>
                                <div class="app-form-actions app-form-actions--inline">
                                    <button id="addDomain" class="btn btn-primary" type="button">Add Domain</button>
                                </div>
                            </div>
                            </th:block>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Departments',
                                helperText='Pick one or more departments. Joint labs span multiple departments; all must belong to the same institution. The institution is derived automatically.',
                                body=~{::#group-department-fields})}">
                            <div id="group-department-fields" class="app-form-field">
                                <label for="groupDepartments">Departments</label>
                                <div id="departmentsContainer" class="app-collection">
                                    <div class="input-group mb-2 app-collection__item" th:each="departmentId, iterStat : *{departmentIds}">
                                        <select class="form-control" th:field="*{departmentIds[__${iterStat.index}__]}">
                                            <option th:each="opt : ${departmentOptions}" th:value="${opt.id}" th:text="${opt.label}"></option>
                                        </select>
                                        <button class="btn btn-danger remove-department" type="button">Remove</button>
                                    </div>
                                </div>
                                <div class="app-form-actions app-form-actions--inline">
                                    <button id="addDepartment" class="btn btn-primary" type="button">Add Department</button>
                                </div>
                            </div>
                            </th:block>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Supervisors',
                                helperText='Group-level supervisors. Department/Division heads are implicit supervisors too — list only the people who need direct access without being a head upstream.',
                                body=~{::#group-supervisor-fields})}">
                            <div id="group-supervisor-fields" class="app-form-field">
                                <label>Supervisors</label>
                                <div id="supervisorsContainer" class="app-collection">
                                    <div class="input-group mb-2 app-collection__item" th:each="supervisorId, iterStat : *{supervisorUserIds}">
                                        <select class="form-control" th:field="*{supervisorUserIds[__${iterStat.index}__]}">
                                            <option value="">— pick a researcher —</option>
                                            <option th:each="researcher : ${allResearchers}"
                                                    th:value="${researcher.email}"
                                                    th:text="${researcher.researcherProfile?.name} + ' &lt;' + ${researcher.email} + '&gt;'"></option>
                                        </select>
                                        <button class="btn btn-danger remove-supervisor" type="button">Remove</button>
                                    </div>
                                </div>
                                <div class="app-form-actions app-form-actions--inline">
                                    <button id="addSupervisor" class="btn btn-primary" type="button">Add supervisor</button>
                                </div>
                            </div>
                            </th:block>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Researchers',
                                helperText='Manage the researcher accounts assigned to this group. Changes are synced through the membership log.',
                                body=~{::#group-researcher-fields})}">
                            <div id="group-researcher-fields" class="app-form-field">
                                <label for="groupResearchers">Researchers</label>
                                <div id="researchersContainer" class="app-collection">
                                    <div class="input-group mb-2 app-collection__item" th:each="memberId, iterStat : ${currentMemberUserIds}">
                                        <select class="form-control" th:name="'userIds[' + ${iterStat.index} + ']'">
                                            <option th:each="researcher : ${allResearchers}"
                                                    th:value="${researcher.email}"
                                                    th:text="${researcher.researcherProfile?.name}"
                                                    th:selected="${researcher.email == memberId}"></option>
                                        </select>
                                        <button class="btn btn-danger remove-researcher" type="button">Remove</button>
                                    </div>
                                </div>
                                <div class="app-form-actions app-form-actions--inline">
                                    <button id="addResearcher" class="btn btn-primary" type="button">Add Researcher</button>
                                </div>
                            </div>
                            </th:block>
                            </th:block>
                        </form>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>
</div>

<!-- Bootstrap core JavaScript-->
<th:block th:replace="~{fragments :: core-scripts}"></th:block>


<script th:inline="javascript">
    $(document).ready(function() {
        let allDomains = /*[[${allDomains}]]*/ [];
        let domainsContainer = $('#domainsContainer');
        let departmentOptions = /*[[${departmentOptions}]]*/ [];
        let departmentsContainer = $('#departmentsContainer');
        let allResearchers = /*[[${allResearchers}]]*/ [];
        let researchersContainer = $('#researchersContainer');

        $('#addDomain').click(function() {
            let index = domainsContainer.children().length;
            domainsContainer.append(`
                <div class="input-group mb-2 app-collection__item">
                    <select class="form-control" name="domainIds[${index}]">
                        ${allDomains.map(domain => `<option value="${domain.id}">${domain.name}</option>`).join('')}
                    </select>
                    <button class="btn btn-danger remove-domain" type="button">Remove</button>
                </div>`);
        });
        domainsContainer.on('click', '.remove-domain', function() {
            $(this).closest('.input-group').remove();
            domainsContainer.children().each(function(index, element) {
                $(element).find('select').attr('name', `domainIds[${index}]`);
            });
        });

        $('#addDepartment').click(function() {
            let index = departmentsContainer.children().length;
            departmentsContainer.append(`
                <div class="input-group mb-2 app-collection__item">
                    <select class="form-control" name="departmentIds[${index}]">
                        ${departmentOptions.map(opt => `<option value="${opt.id}">${opt.label}</option>`).join('')}
                    </select>
                    <button class="btn btn-danger remove-department" type="button">Remove</button>
                </div>`);
        });
        departmentsContainer.on('click', '.remove-department', function() {
            $(this).closest('.input-group').remove();
            departmentsContainer.children().each(function(index, element) {
                $(element).find('select').attr('name', `departmentIds[${index}]`);
            });
        });

        let supervisorsContainer = $('#supervisorsContainer');
        const researcherOption = r =>
            `<option value="${r.email}">${(r.researcherProfile && r.researcherProfile.name) ? r.researcherProfile.name : ''} &lt;${r.email}&gt;</option>`;
        $('#addSupervisor').click(function() {
            let index = supervisorsContainer.children().length;
            supervisorsContainer.append(`
                <div class="input-group mb-2 app-collection__item">
                    <select class="form-control" name="supervisorUserIds[${index}]">
                        <option value="">— pick a researcher —</option>
                        ${allResearchers.map(researcherOption).join('')}
                    </select>
                    <button class="btn btn-danger remove-supervisor" type="button">Remove</button>
                </div>`);
        });
        supervisorsContainer.on('click', '.remove-supervisor', function() {
            $(this).closest('.input-group').remove();
            supervisorsContainer.children().each(function(index, element) {
                $(element).find('select').attr('name', `supervisorUserIds[${index}]`);
            });
        });

        $('#addResearcher').click(function() {
            let index = researchersContainer.children().length;
            researchersContainer.append(`
                <div class="input-group mb-2 app-collection__item">
                    <select class="form-control" name="userIds[${index}]">
                        ${allResearchers.map(researcher => `<option value="${researcher.email}">${researcher.researcherProfile?.name ?? ''}</option>`).join('')}
                    </select>
                    <button class="btn btn-danger remove-researcher" type="button">Remove</button>
                </div>`);
        });
        researchersContainer.on('click', '.remove-researcher', function() {
            $(this).closest('.input-group').remove();
            researchersContainer.children().each(function(index, element) {
                $(element).find('select').attr('name', `userIds[${index}]`);
            });
        });
    });
</script>
</body>
</html>
