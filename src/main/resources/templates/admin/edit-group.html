<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Group</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments :: sidebar('groups')}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Edit Group')}"></div>
            <div class="container-fluid app-page-content">
                <div class="app-workflow">
                    <th:block th:replace="~{fragments :: admin-breadcrumb(${breadcrumbs})}"></th:block>
                    <p class="app-workflow__intro">Edit the group and its relationships in one workflow surface with shared sections for identity, domains, institution, and researchers.</p>

                        <form th:with="adminFormObject=${group}"
                              th:replace="~{fragments :: admin-form(
                                  id='group-admin-form',
                                  action=@{/admin/groups/update},
                                  method='post',
                                  title='Edit Group',
                                  sections=~{::#group-form-sections},
                                  submitLabel='Update',
                                  cancelHref=@{/admin/groups})}">
                            <th:block id="group-form-sections">
                            <input type="hidden" class="form-control" id="groupId" th:field="*{id}" required>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Group profile',
                                helperText='Keep the group identity concise and recognizable for workspace and report contexts.',
                                body=~{::#group-profile-fields})}">
                                <div id="group-profile-fields" class="app-form-grid">
                                    <div class="form-group app-form-field">
                                        <label for="groupName">Name</label>
                                        <input type="text" class="form-control" id="groupName" th:field="*{name}" required>
                                    </div>
                                    <div class="form-group app-form-field">
                                        <label for="groupDescription">Description</label>
                                        <textarea class="form-control" id="groupDescription" th:field="*{description}" required></textarea>
                                    </div>
                                </div>
                            </th:block>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Domains',
                                helperText='Assign the evaluation domains this group participates in.',
                                body=~{::#group-domain-fields})}">
                            <div id="group-domain-fields" class="app-form-field">
                                <label for="groupDomains">Domains</label>
                                <div id="domainsContainer" class="app-collection">
                                    <div class="input-group mb-2 app-collection__item" th:each="domain, iterStat : *{domains}">
                                        <select class="form-control" th:field="*{domains[__${iterStat.index}__]}" th:selected="${domain}">
                                            <option th:each="domain : ${allDomains}" th:value="${domain.id}" th:text="${domain.name}"></option>
                                        </select>
                                        <button class="btn btn-danger remove-domain" type="button">Remove</button>
                                    </div>
                                </div>
                                <div class="app-form-actions app-form-actions--inline">
                                    <button id="addDomain" class="btn btn-primary" type="button">Add Domain</button>
                                </div>
                            </div>
                            </th:block>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Institution',
                                helperText='Choose the institution represented by this group.',
                                body=~{::#group-institution-fields})}">
                            <div id="group-institution-fields" class="form-group app-form-field">
                                <label for="groupAffiliation">Institution</label>
                                <select class="form-control" id="groupAffiliation" th:field="*{institution}">
                                    <option th:each="affiliation : ${affiliations}" th:value="${affiliation.name}" th:text="${affiliation.name}"></option>
                                </select>
                            </div>
                            </th:block>
                            <th:block th:replace="~{fragments :: admin-form-section(
                                title='Researchers',
                                helperText='Manage the researcher accounts assigned to this group.',
                                body=~{::#group-researcher-fields})}">
                            <div id="group-researcher-fields" class="app-form-field">
                                <label for="groupResearchers">Researchers</label>
                                <div id="researchersContainer" class="app-collection">
                                    <div class="input-group mb-2 app-collection__item" th:each="memberId, iterStat : *{memberIds}">
                                        <select class="form-control" th:field="*{memberIds[__${iterStat.index}__]}" th:selected="${memberId}">
                                            <option th:each="researcher : ${allResearchers}" th:value="${researcher.email}" th:text="${researcher.researcherProfile?.name}"></option>
                                        </select>
                                        <button class="btn btn-danger remove-researcher" type="button">Remove</button>
                                    </div>
                                </div>
                                <div class="app-form-actions app-form-actions--inline">
                                    <button id="addResearcher" class="btn btn-primary" type="button">Add Researcher</button>
                                </div>
                            </div>
                            </th:block>
                            </th:block>
                        </form>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>
</div>

<!-- Bootstrap core JavaScript-->
<th:block th:replace="~{fragments :: core-scripts}"></th:block>


<script th:inline="javascript">
    $(document).ready(function() {
        let allDomains = /*[[${allDomains}]]*/ [];
        let domainsContainer = $('#domainsContainer');
        let allResearchers = /*[[${allResearchers}]]*/ [];
        let researchersContainer = $('#researchersContainer');

        $('#addDomain').click(function() {
            let index = domainsContainer.children().length;
            let domainTemplate = `
                <div class="input-group mb-2 app-collection__item">
                    <select class="form-control" name="domains[${index}]">
                        ${allDomains.map(domain => `<option value="${domain.id}">${domain.name}</option>`).join('')}
                    </select>
                    <button class="btn btn-danger remove-domain" type="button">Remove</button>
                </div>`;
            domainsContainer.append(domainTemplate);
        });

        domainsContainer.on('click', '.remove-domain', function() {
            $(this).closest('.input-group').remove();
            // Optionally, update the indices of the remaining elements
            domainsContainer.children().each(function(index, element) {
                $(element).find('select').attr('name', `domains[${index}]`);
            });
        });

        $('#addResearcher').click(function() {
            let index = researchersContainer.children().length;
            let researcherTemplate = `
                <div class="input-group mb-2 app-collection__item">
                    <select class="form-control" name="memberIds[${index}]">
                        ${allResearchers.map(researcher => `<option value="${researcher.email}">${researcher.researcherProfile?.name ?? ''}</option>`).join('')}
                    </select>
                    <button class="btn btn-danger remove-researcher" type="button">Remove</button>
                </div>`;
            researchersContainer.append(researcherTemplate);
        });

        researchersContainer.on('click', '.remove-researcher', function() {
            $(this).closest('.input-group').remove();
            // Optionally, update the indices of the remaining elements
            researchersContainer.children().each(function(index, element) {
                $(element).find('select').attr('name', `memberIds[${index}]`);
            });
        });
    });
</script>
</body>
</html>
