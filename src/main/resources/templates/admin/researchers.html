<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Researchers</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments :: sidebar('researchers')}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            <!-- Topbar -->
            <div th:replace="~{fragments :: navbar('Researchers')}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid app-page-content">
                <div class="app-dashboard">
                    <p class="app-dashboard__intro">Review the current researcher directory and the identifiers stored for each researcher.</p>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header">
                        <h6 class="app-table-section__title">Researchers</h6>
                    </div>
                    <div class="app-table-section__body">
                        <div class="app-table-scroll">
                            <table class="table js-datatable app-table" id="dataTable" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Scholar ID</th>
                                    <th>Scopus ID</th>
                                    <th>WoS ID</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="researcher : ${researchers}">
                                    <td th:text="${researcher.researcherProfile?.name}"></td>
                                    <td th:text="${researcher.researcherProfile?.scholarId}"></td>
                                    <td>
                                        <span th:each="id: ${researcher.researcherProfile?.scopusId}" th:text="${id} "></span>
                                    </td>
                                    <td>
                                        <span th:each="id: ${researcher.researcherProfile?.wosId}" th:text="${id} "></span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <div th:replace="~{fragments :: app-footer}"></div>
            <!-- End of Footer -->
        </div>
        <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top" aria-label="Scroll to top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>

<!-- Bootstrap core JavaScript-->
<th:block th:replace="~{fragments :: core-scripts}"></th:block>

<!-- Page level plugins -->

<!-- Page level custom scripts -->

</body>
</html>
