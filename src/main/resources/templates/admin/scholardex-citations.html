<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Publications</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments :: sidebar('scholardex-publications')}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            <!-- Topbar -->
            <div th:replace="~{fragments :: navbar('Publications')}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid app-page-content">
                <div class="app-dashboard">
                <div class="app-summary-panel">
                    <div class="app-summary-panel__header">
                        <h2 class="app-summary-panel__title" th:text="${publication.title}">Publication details</h2>
                    </div>
                    <div class="app-summary-panel__body">
                            <p>
                                <div th:each="author, iterStat : ${publication.authors}">

                                <a th:if="${authorMap[author]!=null}" th:text="${authorMap[author].name} + (iterStat.last ? '; ' : '')" th:href="@{/user/authors/view/{id}(id=${author})}">
                                    <span>;</span>
                                </a>
                                </div>
                            </p>
                            <p th:text="${publication.subtypeDescription}"></p>

                            <div th:if="${forum != null}">
                            <p>
                                <span th:text="${forum.publicationName}"></span>,
                                <span th:text="${publication.volume}"></span>,
                                <span th:text="${publication.issueIdentifier}"></span>,
                                <span th:if="${!forum.issn.equals('null-')}" th:text="${forum.issn}"></span>
                            </p>
                            </div>
                    </div>
                </div>
                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title">Citations</h6>
                    </div>
                    <div class="app-table-section__body">
                        <div class="app-table-scroll">
                            <table class="table table-bordered js-datatable app-table" id="dataTable" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Year</th>
                                    <th>Venue</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="citation : ${citations}">
                                    <td>
                                        <a th:href="@{/admin/scholardex/publications/citations(id=${citation.id})}" th:text="${citation.title}">Publication Title</a>
                                    </td>
                                    <td th:text="${citation.coverDate}">Year Published</td>
<!--                                    <td></td>-->
                                    <td th:if="${forumMap[citation.forum] != null}" th:text="${forumMap[citation.forum].publicationName}">Venue</td>
<!--                                    </td>-->
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </div>
                </div>
                </div>
            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <div th:replace="~{fragments :: app-footer}"></div>
            <!-- End of Footer -->
        </div>
        <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>

<!-- Bootstrap core JavaScript-->
<th:block th:replace="~{fragments :: core-scripts}"></th:block>

<!-- Page level plugins -->

<!-- Page level custom scripts -->


</body>
</html>
