<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Publications</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('scholardex-publications')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Search Publications')}"></div>
            <div class="container-fluid app-page-content">
                <div class="app-dashboard">
                    <p class="app-dashboard__intro">Review the current publication search results, including titles, authors, and citation counts.</p>
                </div>
                <div class="row">
                    <div id="scrape-result" class="mt-3"></div>
                    <div id="scrape-cit-result" class="mt-3"></div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header">
                        <h6 class="app-table-section__title">Publications</h6>
                    </div>
                    <div class="app-table-section__body">
                        <div class="app-table-scroll">
                            <table class="table js-datatable app-table" id="dataTable" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Authors</th>
                                    <th>Authorship overrides</th>
                                    <th>Citations</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="publication : ${publications}">
                                    <td>
                                        <a th:href="@{/admin/scholardex/publications/citations(id=${publication.id})}" th:text="${publication.title}">Publication Title</a>
                                    </td>
                                    <td>
                                        <div th:each="author, iterStat : ${publication.authors}">

                                            <a th:if="${authorMap[author]!=null}" th:text="${authorMap[author].name} + (iterStat.last ? '; ' : '')" th:href="@{/user/authors/view/{id}(id=${author})}">
                                                <span>;</span>
                                            </a>
                                        </div>
<!--                                        <span th:each="author, iterStat : ${publication.authors}" th:text="${authorMap[author].name} + (iterStat.last ? '; ' : '')"></span>-->
                                    </td>
                                    <td>
                                        <th:block th:with="summary=${decisionSummaryByPublicationId[publication.id]}">
                                            <span th:if="${summary == null}" class="text-muted">None</span>
                                            <div th:if="${summary != null}">
                                                <div>
                                                    <strong th:text="${summary.totalDecisions}">0</strong>
                                                    <span th:text="${summary.totalDecisions == 1 ? ' override' : ' overrides'}">overrides</span>
                                                </div>
                                                <div class="text-muted small"
                                                     th:text="${summary.confirmedCount + ' confirmed / ' + summary.rejectedCount + ' rejected'}">
                                                    0 confirmed / 0 rejected
                                                </div>
                                                <div class="small">
                                                    <span th:text="${'Latest ' + (summary.latestStatus != null ? #strings.toLowerCase(summary.latestStatus.name()) : 'unknown')}">Latest confirmed</span>
                                                    <span th:if="${summary.latestUpdatedAt != null}"
                                                          th:text="${' · ' + #temporals.format(summary.latestUpdatedAt, 'yyyy-MM-dd')}"> · 2026-04-19</span>
                                                </div>
                                            </div>
                                        </th:block>
                                    </td>
                                    <td th:text="${publication.citedbyCount}">0</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </div>
                </div>

            </div>
        </div>

        <div th:replace="~{fragments :: app-footer}"></div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>


</body>
</html>
