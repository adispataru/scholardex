<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Scholardex Affiliations</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('scholardex-affiliations')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Scholardex Affiliations')}"></div>

            <div class="container-fluid app-page-content">
                <p class="mb-4">This is a list of all affiliations currently managed by the system.</p>

                <div class="app-table-filters">
                    <h6 class="app-table-filters__title">Filters</h6>
                        <div class="app-table-filters__grid">
                            <div class="form-group app-table-filters__field app-table-filters__field--span-4">
                                <label for="admin-affiliations-search">Search</label>
                                <input id="admin-affiliations-search" type="text" class="form-control" placeholder="Name, ID, city, country">
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="admin-affiliations-sort">Sort By</label>
                                <select id="admin-affiliations-sort" class="form-control">
                                    <option value="name">Name</option>
                                    <option value="afid">ID</option>
                                    <option value="city">City</option>
                                    <option value="country">Country</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="admin-affiliations-direction">Direction</label>
                                <select id="admin-affiliations-direction" class="form-control">
                                    <option value="asc">Ascending</option>
                                    <option value="desc">Descending</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="admin-affiliations-size">Page Size</label>
                                <select id="admin-affiliations-size" class="form-control">
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title">Detailed View of Affiliations</h6>
                        <span id="admin-affiliations-total-info" class="app-table-toolbar__meta"></span>
                    </div>
                    <div class="app-table-section__body">
                        <div id="admin-affiliations-loading" class="app-table-state app-table-state--info" role="status">Loading affiliations...</div>
                        <div id="admin-affiliations-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                        <div id="admin-affiliations-empty" class="app-table-state app-table-state--warning d-none" role="status">No affiliations found for the current filter.</div>

                        <div class="app-table-scroll">
                            <table class="table app-table" id="admin-affiliations-table" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>ID</th>
                                    <th>City</th>
                                    <th>Country</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody id="admin-affiliations-table-body"></tbody>
                            </table>
                        </div>

                        <div class="app-table-pager">
                            <button id="admin-affiliations-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Previous</button>
                            <span id="admin-affiliations-page-info" class="app-table-pager__info"></span>
                            <button id="admin-affiliations-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Next</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>

<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/admin-scholardex-affiliations.js"></script>

</body>
</html>
