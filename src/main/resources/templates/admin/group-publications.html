<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Publications</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments :: sidebar('groups')}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            <!-- Topbar -->
            <div th:replace="~{fragments :: navbar(${group.name})}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid app-page-content">
                <div class="app-page-toolbar">
                    <a th:href="@{/admin/groups/{id}/publications/exportCNFIS2025(id=${group.id})}" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                        <i class="fa-solid fa-download fa-sm text-white-50"></i> Export CNFIS
                    </a>
                    <a th:href="@{/admin/groups/{id}/publications/exportAllReports(id=${group.id})}" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                        <i class="fa-solid fa-download fa-sm text-white-50"></i> Export CNFIS zip
                    </a>
                    <a th:href="@{/admin/groups/{id}/publications/export(id=${group.id})}" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
                        <i class="fa-solid fa-download fa-sm text-white-50"></i> Export CSV
                    </a>

                </div>
                <div class="row">
                    <div class="col-xl-9 col-md-12 mb-4">
                        <div class="card border-left-primary shadow h-100 py-2">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class=" font-weight-bold text-primary text-uppercase mb-1" th:text="${publications.size()}">
                                            nb</div>
                                        <div class="h5 mb-0 font-weight-bold text-gray-800" >Publications</div>
                                    </div>

                                    <canvas id="chart-publications"></canvas>

                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-12 mb-4">
                        <div class="app-table-section">
                            <div class="app-table-section__surface">
                            <div class="app-table-section__header app-table-toolbar">
                                <h6 class="app-table-section__title">Individual Reports</h6>
                            </div>
                            <div class="app-table-section__body">
                                <div class="app-table-scroll">
                                    <table class="table table-bordered js-datatable app-table" id="groupReportsTable" width="100%" cellspacing="0">
                                        <thead>
                                        <tr>
                                            <th>Title</th>
                                            <th>Actions</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="report : ${individualReports}">
                                            <td th:text="${report.title}">Report Title</td>
                                            <td>
                                                <a th:href="@{/admin/groups/{gid}/reports/view/{id}(gid=${group.id},id=${report.id})}" class="btn btn-primary btn-sm">Apply</a>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            </div>
                        </div>
                    </div>
<!--                    &lt;!&ndash; Earnings (Monthly) Card Example &ndash;&gt;-->
<!--                    <div class="col-xl-3 col-md-6 mb-4">-->
<!--                        <div class="card border-left-primary shadow h-100 py-2">-->
<!--                            <div class="card-body">-->
<!--                                <div class="row no-gutters align-items-center">-->
<!--                                    <div class="col mr-2">-->
<!--                                        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">-->
<!--                                            h-Index </div>-->
<!--                                        <div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${hIndex}"></div>-->
<!--                                    </div>-->
<!--                                    <div class="col-auto">-->
<!--                                        <i class="fa-solid fa-hashtag fa-2x text-primary"></i>-->
<!--                                    </div>-->
<!--                                </div>-->
<!--                            </div>-->
<!--                        </div>-->
<!--                    </div>-->

                </div>

                <div class="row">
                    <div class="col-12 mb-4">
                        <div class="card shadow h-100 py-2">
                            <div class="card-body">
                                <div class="font-weight-bold text-primary text-uppercase mb-3">Venue Quality Distribution By Year</div>
                                <canvas id="chart-venue-quality"></canvas>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- DataTales Example -->
                <div class="app-table-section mb-4" th:each="entry : ${publicationsByYear}">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title" th:text="${entry.key}">Year</h6>
                    </div>
                    <div class="app-table-section__body">
                        <div class="app-table-scroll">
                            <table class="table table-bordered js-datatable app-table" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Year</th>
                                    <th>Authors</th>
                                    <th>Type</th>
                                    <th>Venue</th>
                                    <th>Citations</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="publication : ${entry.value}">
                                    <td>
                                        <a th:href="@{/user/publications/citations(id=${publication.id})}" th:text="${publication.title}">Publication Title</a>
                                    </td>
                                    <td th:text="${publication.coverDate}">Year Published</td>
                                    <td>
                                        <div th:each="author, iterStat : ${publication.authors}">

                                            <a th:if="${authorMap[publication.authors[iterStat.index]] != null}" th:text="${authorMap[publication.authors[iterStat.index]].name} + (iterStat.last ? '; ' : '')" th:href="@{/user/authors/view/{id}(id=${author})}">
                                                <span>;</span>
                                            </a>
                                            <span th:if="${authorMap[publication.authors[iterStat.index]] == null}" th:text="${author}"></span>
                                        </div>
<!--                                        <span th:each="author, iterStat : ${publication.authors}" th:text="${authorMap[author].name} + (iterStat.last ? '; ' : '')"></span>-->
                                    </td>
                                    <td th:text="${publication.subtypeDescription}">0</td>
                                    <td>
                                        <p th:if="${forumMap[publication.forum] != null}" th:text="${forumMap[publication.forum].publicationName}">

                                        </p>
                                    </td>

                                    <td th:text="${publication.citedbyCount}">0</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <div th:replace="~{fragments :: app-footer}"></div>
            <!-- End of Footer -->
        </div>
        <!-- End of Content Wrapper -->
    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>

<!-- Bootstrap core JavaScript-->
<th:block th:replace="~{fragments :: core-scripts}"></th:block>

<!-- Page level plugins -->

<!-- Page level custom scripts -->
<script th:inline="javascript">
    var countData = /*[[${publicationsCountByYear}]]*/ '{}';
    var years = Object.keys(countData)
        .sort(function(a, b) { return Number(a) - Number(b); })
        .slice(-10);
    var counts = years.map(y => countData[y]);
    var venueClassCountByYear = /*[[${venueClassCountByYear}]]*/ '{}';
    var journalBuckets = ['Q1', 'Q2', 'Q3', 'Q4', 'SCOPUS'];
    var conferenceBuckets = ['A_STAR', 'A', 'B', 'C', 'D', 'SCOPUS', 'LNCS'];
    var bookLncsBuckets = ['BOOK_LNCS'];
    var unrankedBuckets = ['Unranked'];
    var venueBucketColors = {
        'Q1': 'rgba(220, 53, 69, 0.82)',
        'Q2': 'rgba(255, 193, 7, 0.85)',
        'Q3': 'rgba(255, 255, 255, 0.96)',
        'Q4': 'rgba(233, 236, 239, 0.96)',
        'A_STAR': 'rgba(220, 53, 69, 0.82)',
        'A': 'rgba(220, 53, 69, 0.82)',
        'B': 'rgba(255, 193, 7, 0.85)',
        'C': 'rgba(255, 255, 255, 0.96)',
        'D': 'rgba(233, 236, 239, 0.96)',
        'LNCS': 'rgba(86, 180, 233, 0.88)',
        'BOOK_LNCS': 'rgba(0, 114, 178, 0.82)',
        'SCOPUS': 'rgba(0, 158, 115, 0.82)',
        'Unranked': 'rgba(90, 90, 90, 0.9)'
    };
    var venueBucketBorders = {
        'Q1': 'rgba(220, 53, 69, 1)',
        'Q2': 'rgba(196, 143, 0, 1)',
        'Q3': 'rgba(173, 181, 189, 1)',
        'Q4': 'rgba(173, 181, 189, 1)',
        'A_STAR': 'rgba(220, 53, 69, 1)',
        'A': 'rgba(220, 53, 69, 1)',
        'B': 'rgba(196, 143, 0, 1)',
        'C': 'rgba(173, 181, 189, 1)',
        'D': 'rgba(173, 181, 189, 1)',
        'LNCS': 'rgba(0, 114, 178, 1)',
        'BOOK_LNCS': 'rgba(0, 78, 128, 1)',
        'SCOPUS': 'rgba(0, 115, 85, 1)',
        'Unranked': 'rgba(60, 60, 60, 1)'
    };

    var ctx = document.getElementById('chart-publications').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: years,
            datasets: [{
                label: 'Publications',
                data: counts,
                backgroundColor: 'rgba(78, 115, 223, 0.5)',
                borderColor: 'rgba(78, 115, 223, 1)',
                borderWidth: 1
            }]
        },
        options: {
            aspectRatio: 3,
            scales: {
                xAxes: [{ gridLines: { display: false } }],
                yAxes: [{ ticks: { beginAtZero: true, stepSize: 1 } }]
            },
            legend: { display: false }
        }
    });

    var venueYears = Object.keys(venueClassCountByYear)
        .sort(function(a, b) { return Number(a) - Number(b); })
        .slice(-10);
    function buildStackedDatasets(bucketNames, stackName) {
        return bucketNames.map(function(bucket) {
            return {
                label: bucket,
                stack: stackName,
                data: venueYears.map(function(year) {
                    return (venueClassCountByYear[year] || {})[bucket] || 0;
                }),
                backgroundColor: venueBucketColors[bucket] || 'rgba(73, 80, 87, 0.9)',
                borderColor: venueBucketBorders[bucket] || 'rgba(52, 58, 64, 1)',
                borderWidth: 1
            };
        });
    }

    var venueDatasets = []
        .concat(buildStackedDatasets(journalBuckets, 'journals'))
        .concat(buildStackedDatasets(conferenceBuckets, 'conferences'))
        .concat(buildStackedDatasets(bookLncsBuckets, 'book-lncs'))
        .concat(buildStackedDatasets(unrankedBuckets, 'unranked'))
        .filter(function(dataset) {
        return dataset.data.some(function(value) { return value > 0; });
    });
    var venueStackGroups = ['journals', 'conferences', 'book-lncs', 'unranked'];
    var venueYearStackHeights = venueYears.map(function(year, index) {
        return venueStackGroups.map(function(stackName) {
            return venueDatasets
                .filter(function(dataset) { return dataset.stack === stackName; })
                .reduce(function(total, dataset) {
                    return total + (dataset.data[index] || 0);
                }, 0);
        });
    });
    var maxVenueStack = venueYearStackHeights.length
        ? Math.max.apply(null, venueYearStackHeights.flat())
        : 0;
    var venueSuggestedMax = maxVenueStack > 0 ? Math.ceil(maxVenueStack * 1.1) : 1;

    var venueChartCtx = document.getElementById('chart-venue-quality').getContext('2d');
    new Chart(venueChartCtx, {
        type: 'bar',
        data: {
            labels: venueYears,
            datasets: venueDatasets
        },
        options: {
            aspectRatio: 3,
            scales: {
                xAxes: [{ stacked: true, categoryPercentage: 0.7, barPercentage: 0.9, gridLines: { display: false } }],
                yAxes: [{
                    stacked: true,
                    ticks: {
                        beginAtZero: true,
                        stepSize: 1,
                        suggestedMax: venueSuggestedMax
                    }
                }]
            },
            legend: { display: true }
        }
    });
</script>


</body>
</html>
