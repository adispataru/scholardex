<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Scholardex Authors</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('scholardex-authors')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Scholardex Authors')}"></div>

            <div class="container-fluid app-page-content">
                <p class="mb-4">This is a list of all authors currently managed by the system.</p>

                <div class="app-table-filters">
                    <h6 class="app-table-filters__title">Filters</h6>
                        <div class="app-table-filters__grid">
                            <div class="form-group app-table-filters__field app-table-filters__field--span-4">
                                <label for="admin-authors-search">Search</label>
                                <input id="admin-authors-search" type="text" class="form-control" placeholder="Author name or ID">
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-4">
                                <label for="admin-authors-sort">Sort By</label>
                                <select id="admin-authors-sort" class="form-control">
                                    <option value="name">Name</option>
                                    <option value="id">ID</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="admin-authors-direction">Direction</label>
                                <select id="admin-authors-direction" class="form-control">
                                    <option value="asc">Ascending</option>
                                    <option value="desc">Descending</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="admin-authors-size">Page Size</label>
                                <select id="admin-authors-size" class="form-control">
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title">Detailed View of Authors</h6>
                        <div class="d-flex align-items-center gap-2">
                            <span id="admin-authors-total-info" class="app-table-toolbar__meta"></span>
                            <div class="app-table-toolbar__actions" id="authors-toolbar-actions"></div>
                        </div>
                    </div>
                    <div class="app-table-section__body">
                        <div id="admin-authors-loading" class="app-table-state app-table-state--info" role="status">Loading authors...</div>
                        <div id="admin-authors-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                        <div id="admin-authors-empty" class="app-table-state app-table-state--warning d-none" role="status">No authors found for the current search.</div>

                        <div class="app-table-scroll">
                            <table class="table app-table" id="admin-authors-table" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th data-col="name">Name</th>
                                    <th data-col="affiliations">Affiliations</th>
                                    <th data-col="actions">Actions</th>
                                </tr>
                                </thead>
                                <tbody id="admin-authors-table-body"></tbody>
                            </table>
                        </div>

                        <div class="app-table-pager">
                            <button id="admin-authors-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Previous</button>
                            <span id="admin-authors-page-info" class="app-table-pager__info"></span>
                            <button id="admin-authors-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Next</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top" aria-label="Scroll to top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>

<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/admin-scholardex-authors.js"></script>

</body>
</html>
