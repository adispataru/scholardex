<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{orgunit.compare.meta.title(${vm.unitName}, ${vm.olderReport.title}, ${vm.newerReport.title})}">Compare reports</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar(${unitType} + 's')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar(#{orgunit.compare.navTitle(${vm.unitName})})}"></div>
            <div class="container-fluid app-page-content">
                <div class="app-page-toolbar app-workflow">
                    <p class="app-workflow__intro">
                        <th:block th:text="#{orgunit.compare.intro(${vm.unitName}, ${vm.olderReport.title}, ${vm.newerReport.title})}">comparison</th:block><th:block
                            th:if="${vm.membersWithoutOlderRun > 0}"
                            th:text="#{orgunit.compare.withoutRun(${vm.membersWithoutOlderRun}, ${vm.olderReport.title})}"></th:block><th:block
                            th:if="${vm.membersWithoutNewerRun > 0}"
                            th:text="#{orgunit.compare.withoutRun(${vm.membersWithoutNewerRun}, ${vm.newerReport.title})}"></th:block>.
                        <span class="text-muted" th:text="#{orgunit.compare.note}">Latest run per side.</span>
                    </p>
                    <div class="app-workflow__actions">
                        <a th:href="${backHref}" class="btn btn-outline-secondary btn-sm" th:text="#{orgunit.compare.back}">← Back to report</a>
                    </div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                        <div class="app-table-section__body">
                            <div class="app-table-scroll">
                                <table class="table app-table">
                                    <thead>
                                    <tr>
                                        <th rowspan="2" th:text="#{orgunit.col.researcher}">Researcher</th>
                                        <th rowspan="2" th:text="#{orgunit.col.position}">Position</th>
                                        <th th:if="${unitType == 'division'}" rowspan="2" th:text="#{orgunit.col.department}">Department</th>
                                        <th th:each="col : ${vm.columns}" colspan="3" th:text="${col.name}">Criterion</th>
                                        <th colspan="3" th:text="#{orgunit.compare.total}">Total</th>
                                    </tr>
                                    <tr>
                                        <th:block th:each="col : ${vm.columns}">
                                            <th class="text-right" th:text="${vm.olderReport.title}">Older</th>
                                            <th class="text-right" th:text="${vm.newerReport.title}">Newer</th>
                                            <th class="text-right">Δ</th>
                                        </th:block>
                                        <th class="text-right" th:text="${vm.olderReport.title}">Older</th>
                                        <th class="text-right" th:text="${vm.newerReport.title}">Newer</th>
                                        <th class="text-right">Δ</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="row : ${vm.rows}">
                                        <td th:text="${row.user.researcherProfile?.name}">Name</td>
                                        <td th:text="${row.user.researcherProfile?.position}"></td>
                                        <td th:if="${unitType == 'division'}"
                                            th:text="${row.departmentLabel != null ? row.departmentLabel : '—'}"></td>
                                        <th:block th:each="col : ${vm.columns}">
                                            <td class="text-right">
                                                <span th:if="${row.olderScoresByCriterion[col.name] != null}"
                                                      th:text="${#numbers.formatDecimal(row.olderScoresByCriterion[col.name], 1, 2)}">0.00</span>
                                                <span th:unless="${row.olderScoresByCriterion[col.name] != null}" class="text-muted">—</span>
                                            </td>
                                            <td class="text-right">
                                                <span th:if="${row.newerScoresByCriterion[col.name] != null}"
                                                      th:text="${#numbers.formatDecimal(row.newerScoresByCriterion[col.name], 1, 2)}">0.00</span>
                                                <span th:unless="${row.newerScoresByCriterion[col.name] != null}" class="text-muted">—</span>
                                            </td>
                                            <td class="text-right">
                                                <th:block th:with="d=${row.deltaByCriterion[col.name]},p=${row.deltaPercentByCriterion[col.name]}">
                                                    <span th:if="${d != null}"
                                                          th:class="${d > 0.005 ? 'badge badge-success' : (d lt -0.005 ? 'badge badge-danger' : 'badge badge-secondary')}"
                                                          th:text="${(d > 0.005 ? '+' : '') + #numbers.formatDecimal(d, 1, 2)
                                                                    + (p != null ? ' (' + #numbers.formatDecimal(p > 0 ? p : -p, 1, 2) + '%)' : '')}">+0.00 (0.00%)</span>
                                                    <span th:unless="${d != null}" class="text-muted">—</span>
                                                </th:block>
                                            </td>
                                        </th:block>
                                        <td class="text-right">
                                            <span th:if="${row.olderTotal != null}"
                                                  th:text="${#numbers.formatDecimal(row.olderTotal, 1, 2)}">0.00</span>
                                            <span th:unless="${row.olderTotal != null}" class="text-muted">—</span>
                                            <span th:if="${row.olderProvisional}" class="badge badge-info ml-1"
                                                  th:title="#{orgunit.view.provisionalTitle}"
                                                  th:text="#{orgunit.compare.provAbbrev}">prov.</span>
                                        </td>
                                        <td class="text-right">
                                            <span th:if="${row.newerTotal != null}"
                                                  th:text="${#numbers.formatDecimal(row.newerTotal, 1, 2)}">0.00</span>
                                            <span th:unless="${row.newerTotal != null}" class="text-muted">—</span>
                                            <span th:if="${row.newerProvisional}" class="badge badge-info ml-1"
                                                  th:title="#{orgunit.view.provisionalTitle}"
                                                  th:text="#{orgunit.compare.provAbbrev}">prov.</span>
                                        </td>
                                        <td class="text-right">
                                            <span th:if="${row.totalDelta != null}"
                                                  th:class="${row.totalDelta > 0.005 ? 'badge badge-success' : (row.totalDelta lt -0.005 ? 'badge badge-danger' : 'badge badge-secondary')}"
                                                  th:text="${(row.totalDelta > 0.005 ? '+' : '') + #numbers.formatDecimal(row.totalDelta, 1, 2)
                                                            + (row.totalDeltaPercent != null ? ' (' + #numbers.formatDecimal(row.totalDeltaPercent > 0 ? row.totalDeltaPercent : -row.totalDeltaPercent, 1, 2) + '%)' : '')}">+0.00 (0.00%)</span>
                                            <span th:unless="${row.totalDelta != null}" class="text-muted">—</span>
                                        </td>
                                    </tr>
                                    <tr th:if="${vm.rows.isEmpty()}" class="app-admin-empty-row">
                                        <td th:colspan="${(unitType == 'division' ? 3 : 2) + (#lists.size(vm.columns) * 3) + 3}">
                                            <th:block th:replace="~{fragments :: admin-empty-state(
                                                #{orgunit.empty.noResearchers.title},
                                                #{orgunit.empty.noResearchers.body},
                                                '', '')}"></th:block>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments :: core-scripts}"></th:block>
</body>
</html>
