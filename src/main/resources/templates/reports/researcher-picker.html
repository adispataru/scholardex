<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Researcher reports</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('researcher-reports')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Researcher reports')}"></div>

            <div class="container-fluid app-page-content">
                <div class="app-page-toolbar app-workflow">
                    <p class="app-workflow__intro">
                        Open the individual evaluation report a researcher sees — read-only, with the
                        option to refresh or export it on their behalf.
                    </p>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                        <div class="app-table-section__header">
                            <h6 class="app-table-section__title">Researchers in scope</h6>
                        </div>
                        <div class="app-table-section__body">
                            <th:block th:if="${#lists.isEmpty(researchers)}"
                                      th:replace="~{fragments :: admin-empty-state(
                                          'No researchers in scope',
                                          'You do not currently oversee any researchers with a profile.',
                                          null, null)}"></th:block>

                            <div th:unless="${#lists.isEmpty(researchers)}" class="app-table-scroll">
                                <table class="table js-datatable app-table" id="researcherReportsTable"
                                       width="100%" cellspacing="0">
                                    <thead>
                                    <tr>
                                        <th scope="col">Researcher</th>
                                        <th scope="col">Email</th>
                                        <th scope="col">Report</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="r : ${researchers}">
                                        <td th:text="${r.researcherProfile != null and r.researcherProfile.name != null and !#strings.isEmpty(r.researcherProfile.name) ? r.researcherProfile.name : r.email}">
                                            Researcher name
                                        </td>
                                        <td><span class="text-muted" th:text="${r.email}">email</span></td>
                                        <td>
                                            <a class="btn btn-sm btn-outline-primary"
                                               th:href="@{/reports/researcher/{e}(e=${r.email})}"
                                               th:aria-label="'View ' + ${r.email} + ' report'">
                                                <i class="fa-solid fa-up-right-from-square fa-xs" aria-hidden="true"></i>
                                                View report
                                            </a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments :: core-scripts}"></th:block>
</body>
</html>
