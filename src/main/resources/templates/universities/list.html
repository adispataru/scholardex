<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>URAP Rankings</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('rankings-urap')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('URAP University Rankings')}"></div>
            <div class="container-fluid app-page-content">
                <p class="mb-4">This page displays the rankings of universities based on URAP.</p>

                <div class="app-table-filters">
                    <h6 class="app-table-filters__title">Filters</h6>
                        <div class="app-table-filters__grid">
                            <div class="form-group app-table-filters__field app-table-filters__field--span-5">
                                <label for="urap-search">Search</label>
                                <input id="urap-search" type="text" class="form-control" placeholder="University or country">
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="urap-sort">Sort By</label>
                                <select id="urap-sort" class="form-control">
                                    <option value="name">University</option>
                                    <option value="country">Country</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="urap-direction">Direction</label>
                                <select id="urap-direction" class="form-control">
                                    <option value="asc">Ascending</option>
                                    <option value="desc">Descending</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="urap-size">Page Size</label>
                                <select id="urap-size" class="form-control">
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title">University Rankings</h6>
                        <span id="urap-total-info" class="app-table-toolbar__meta"></span>
                    </div>
                    <div class="app-table-section__body">
                        <div id="urap-loading" class="app-table-state app-table-state--info" role="status">Loading rankings...</div>
                        <div id="urap-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                        <div id="urap-empty" class="app-table-state app-table-state--warning d-none" role="status">No rankings found for the current filter.</div>

                        <div class="app-table-scroll">
                            <table class="table table-bordered app-table" id="urap-table" data-detail-base="/universities" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>University</th>
                                    <th>Country</th>
                                    <th>Year</th>
                                    <th>Article</th>
                                    <th>Citation</th>
                                    <th>Total Document</th>
                                    <th>AIT</th>
                                    <th>CIT</th>
                                    <th>Collaboration</th>
                                    <th>Total Score</th>
                                </tr>
                                </thead>
                                <tbody id="urap-table-body"></tbody>
                            </table>
                        </div>

                        <div class="app-table-pager">
                            <button id="urap-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Previous</button>
                            <span id="urap-page-info" class="app-table-pager__info"></span>
                            <button id="urap-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Next</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/rankings-urap.js"></script>

</body>
</html>
