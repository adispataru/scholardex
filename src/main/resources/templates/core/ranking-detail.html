<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${conf.name + ' (' + conf.acronym + ') — CORE Conference Ranking'}">Conference Ranking</title>
    <meta name="description"
          th:content="${'Explore the CORE ranking history for ' + conf.name + ' (' + conf.acronym + ').'}">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${conf.name + ' (' + conf.acronym + ') — CORE Conference Ranking'}">
    <meta property="og:description"
          th:content="${'See CORE ranking trends across years for the ' + conf.name + ' conference.'}">
    <meta property="og:url" th:content="@{/core/rankings/{id}(id=${conf.id})}">
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body class="app-public-page">

<th:block th:replace="~{fragments :: public-shell('rankings')}"></th:block>

<main class="app-public-content" id="main-content">
    <div class="app-page-content">
        <th:block th:replace="~{fragments :: breadcrumb(${breadcrumbs}, 'default')}"></th:block>

        <section aria-labelledby="conf-summary-title">
            <div class="app-university-detail__section-header">
                <div>
                    <p class="app-university-detail__eyebrow" th:text="#{core.detail.eyebrow}">CORE Conference</p>
                    <h1 id="conf-summary-title" class="app-university-detail__section-title" th:text="${conf.name}">Conference Name</h1>
                </div>
                <a href="/rankings#core" class="btn btn-outline-primary btn-sm">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    <span th:text="#{core.detail.back}">All rankings</span>
                </a>
            </div>

            <div class="app-summary-grid">
                <th:block th:replace="~{fragments :: stat-card(
                    label='CORE Rank',
                    value=${latestRankLabel},
                    accent=${latestRankAccent},
                    contextLine=${latestYear != null ? 'CORE ' + latestYear + ' edition' : 'No ranked edition'},
                    icon='fa-solid fa-ranking-star')}"></th:block>
                <th:block th:replace="~{fragments :: stat-card(
                    label='Acronym',
                    value=${conf.acronym},
                    accent='neutral',
                    contextLine=null,
                    icon='fa-solid fa-tag')}"></th:block>
                <th:block th:replace="~{fragments :: stat-card(
                    label='Source',
                    value=${conf.source},
                    accent='neutral',
                    contextLine=${conf.sourceId},
                    icon='fa-solid fa-database')}"></th:block>
            </div>
        </section>

        <section class="mt-4" aria-labelledby="conf-chart-title">
            <div class="app-university-detail__section-header">
                <h2 id="conf-chart-title" class="app-university-detail__section-title" th:text="#{core.detail.overTheYears}">Rankings Over the Years</h2>
            </div>
            <th:block th:replace="~{fragments :: core-ranking-chart(${conf})}"></th:block>
        </section>

        <section class="mt-4" th:if="${!editions.isEmpty()}" aria-labelledby="conf-editions-title">
            <div class="app-university-detail__section-header">
                <h2 id="conf-editions-title" class="app-university-detail__section-title"><span th:text="#{core.detail.editions}">Editions</span></h2>
            </div>
            <div class="app-table-scroll">
                <table class="table table-bordered app-table">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{core.detail.edition}">Edition</th>
                        <th scope="col" th:text="#{universities.detail.rank}">Rank</th>
                        <th scope="col" th:text="#{core.detail.fieldsOfResearch}">Fields of research</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="edition : ${editions}">
                        <td class="app-table__cell--numeric" th:text="${edition.key}">2026</td>
                        <td th:text="${edition.value.rank != null ? edition.value.rank.displayLabel() : (edition.value.rankString ?: '—')}">A</td>
                        <td th:text="${edition.value.fieldsOfResearchNames != null and edition.value.fieldsOfResearchNames.length > 0
                                       ? #strings.arrayJoin(edition.value.fieldsOfResearchNames, ', ')
                                       : (edition.value.fieldsOfResearch != null and edition.value.fieldsOfResearch.length > 0
                                          ? #strings.arrayJoin(edition.value.fieldsOfResearch, ', ')
                                          : '—')}">Information systems</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<th:block th:replace="~{fragments :: app-footer}"></th:block>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>

</body>
</html>
