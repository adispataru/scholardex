<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${conf.name + ' (' + conf.acronym + ') — CORE Conference Ranking'}">Conference Ranking</title>
    <meta name="description"
          th:content="${'Explore the CORE ranking history for ' + conf.name + ' (' + conf.acronym + ').'}">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${conf.name + ' (' + conf.acronym + ') — CORE Conference Ranking'}">
    <meta property="og:description"
          th:content="${'See CORE ranking trends across years for the ' + conf.name + ' conference.'}">
    <meta property="og:url" th:content="@{/core/rankings/{id}(id=${conf.id})}">
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body class="app-public-page">

<th:block th:replace="~{fragments :: public-shell('rankings')}"></th:block>

<main class="app-public-content" id="main-content">
    <div class="app-page-content">
        <th:block th:replace="~{fragments :: breadcrumb(${breadcrumbs}, 'default')}"></th:block>

        <section aria-labelledby="conf-summary-title">
            <div class="app-university-detail__section-header">
                <div>
                    <p class="app-university-detail__eyebrow">CORE Conference</p>
                    <h1 id="conf-summary-title" class="app-university-detail__section-title" th:text="${conf.name}">Conference Name</h1>
                </div>
                <a href="/rankings#core" class="btn btn-outline-primary btn-sm">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    <span>All rankings</span>
                </a>
            </div>

            <div class="app-summary-grid">
                <th:block th:replace="~{fragments :: stat-card(
                    label='CORE Rank',
                    value=${latestRankLabel},
                    accent=${latestRankAccent},
                    contextLine='Closest to 2023',
                    icon='fa-solid fa-ranking-star')}"></th:block>
                <th:block th:replace="~{fragments :: stat-card(
                    label='Acronym',
                    value=${conf.acronym},
                    accent='neutral',
                    contextLine=null,
                    icon='fa-solid fa-tag')}"></th:block>
                <th:block th:replace="~{fragments :: stat-card(
                    label='Source',
                    value=${conf.source},
                    accent='neutral',
                    contextLine=${conf.sourceId},
                    icon='fa-solid fa-database')}"></th:block>
            </div>
        </section>

        <section class="mt-4" aria-labelledby="conf-chart-title">
            <h2 id="conf-chart-title" class="app-university-detail__section-title">Rankings Over the Years</h2>
            <th:block th:replace="~{fragments :: core-ranking-chart(${conf})}"></th:block>
        </section>
    </div>
</main>

<th:block th:replace="~{fragments :: app-footer}"></th:block>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>

</body>
</html>
