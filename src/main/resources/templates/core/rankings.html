<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rankings</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <div th:replace="~{fragments :: sidebar('rankings-core')}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments :: navbar('Core Rankings')}"></div>
            <div class="container-fluid app-page-content">
                <p class="mb-4">This page displays the rankings of conferences.</p>

                <div class="app-table-filters">
                    <h6 class="app-table-filters__title">Filters</h6>
                        <div class="app-table-filters__grid">
                            <div class="form-group app-table-filters__field app-table-filters__field--span-5">
                                <label for="core-search">Search</label>
                                <input id="core-search" type="text" class="form-control" placeholder="Conference, acronym, source ID">
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="core-sort">Sort By</label>
                                <select id="core-sort" class="form-control">
                                    <option value="name">Conference</option>
                                    <option value="acronym">Acronym</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="core-direction">Direction</label>
                                <select id="core-direction" class="form-control">
                                    <option value="asc">Ascending</option>
                                    <option value="desc">Descending</option>
                                </select>
                            </div>
                            <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                                <label for="core-size">Page Size</label>
                                <select id="core-size" class="form-control">
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                </div>

                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header app-table-toolbar">
                        <h6 class="app-table-section__title">Conference Rankings</h6>
                        <span id="core-total-info" class="app-table-toolbar__meta"></span>
                    </div>
                    <div class="app-table-section__body">
                        <div id="core-loading" class="app-table-state app-table-state--info" role="status">Loading rankings...</div>
                        <div id="core-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                        <div id="core-empty" class="app-table-state app-table-state--warning d-none" role="status">No rankings found for the current filter.</div>

                        <div class="app-table-scroll">
                            <table class="table table-bordered app-table" id="core-table" data-detail-base="/core/rankings" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Conference</th>
                                    <th>Acronym</th>
                                    <th>Category 2023</th>
                                </tr>
                                </thead>
                                <tbody id="core-table-body"></tbody>
                            </table>
                        </div>

                        <div class="app-table-pager">
                            <button id="core-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Previous</button>
                            <span id="core-page-info" class="app-table-pager__info"></span>
                            <button id="core-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Next</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/rankings-core.js"></script>

</body>
</html>
