<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forums — ScholarDex</title>
    <meta name="description" content="Browse all canonical academic forums and filter by WoS availability.">
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body class="app-public-page">

<th:block th:replace="~{fragments :: public-shell('forums')}"></th:block>

<main class="app-public-content" id="main-content">
    <div class="app-page-content">
        <div class="app-page-intro">
            <p class="app-page-intro__body">Search and filter journals and conferences indexed in the ScholarDex catalog. Click any entry to view its full profile, rankings, and publication metrics.</p>
        </div>
        <div class="app-table-filters">
            <h2 class="app-table-filters__title">Filters</h2>
            <div class="app-table-filters__grid">
                <div class="form-group app-table-filters__field app-table-filters__field--span-4">
                    <label for="scholardex-forums-search">Search</label>
                    <th:block th:replace="~{fragments :: search-input(
                        id='scholardex-forums-search',
                        name='q',
                        placeholder='Forum, ISSN, eISSN, aggregation type',
                        value='',
                        kbdHint=null,
                        clearable=true)}"></th:block>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="scholardex-forums-sort">Sort By</label>
                    <select id="scholardex-forums-sort" class="form-control">
                        <option value="publicationName">Forum</option>
                        <option value="issn">ISSN</option>
                        <option value="eIssn">eISSN</option>
                        <option value="aggregationType">Aggregation Type</option>
                        <option value="wosStatus">WoS Status</option>
                    </select>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="scholardex-forums-direction">Direction</label>
                    <select id="scholardex-forums-direction" class="form-control">
                        <option value="asc">Ascending</option>
                        <option value="desc">Descending</option>
                    </select>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="scholardex-forums-wos">WoS Status</label>
                    <select id="scholardex-forums-wos" class="form-control">
                        <option value="all">All</option>
                        <option value="indexed">WoS indexed</option>
                        <option value="not_indexed">Not indexed by WoS</option>
                        <option value="not_applicable">Not applicable</option>
                    </select>
                </div>
                <div class="form-group app-table-filters__field app-table-filters__field--span-2">
                    <label for="scholardex-forums-size">Page Size</label>
                    <select id="scholardex-forums-size" class="form-control">
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="app-table-section">
            <div class="app-table-section__surface">
                <div class="app-table-section__header app-table-toolbar">
                    <h2 class="app-table-section__title">Forum Directory</h2>
                    <span id="scholardex-forums-total-info" class="app-table-toolbar__meta"></span>
                </div>
                <div class="app-table-section__body">
                    <div id="scholardex-forums-loading" class="app-table-state app-table-state--info" role="status">Loading forums...</div>
                    <div id="scholardex-forums-error" class="app-table-state app-table-state--danger d-none" role="alert"></div>
                    <div id="scholardex-forums-empty" class="app-table-state app-table-state--warning d-none" role="status">No forums found for the current filter.</div>

                    <div class="app-table-scroll">
                        <table class="table table-bordered app-table" id="scholardex-forums-table" width="100%" cellspacing="0">
                            <thead>
                            <tr>
                                <th>Forum</th>
                                <th>ISSN</th>
                                <th>eISSN</th>
                                <th>Aggregation Type</th>
                                <th>WoS Status</th>
                            </tr>
                            </thead>
                            <tbody id="scholardex-forums-table-body"></tbody>
                        </table>
                    </div>

                    <div class="app-table-pager">
                        <button id="scholardex-forums-prev" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Previous</button>
                        <span id="scholardex-forums-page-info" class="app-table-pager__info"></span>
                        <button id="scholardex-forums-next" class="btn btn-outline-primary btn-sm app-table-pager__button" type="button">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments :: app-footer}"></th:block>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>
<script src="/js/scholardex-forums.js"></script>

</body>
</html>
