<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Artistic Events</title>
    <th:block th:replace="~{fragments :: core-styles}"></th:block>
</head>
<body id="page-top">

<div id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments :: sidebar('rankings-events')}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            <div th:replace="~{fragments :: navbar('Artistic Events')}"></div>
            <div class="container-fluid app-page-content">
                <div class="app-dashboard">
                    <p class="app-dashboard__intro">Browse the artistic events recorded by the system, including the event name, rank, and domain for each entry.</p>
                </div>
                <div class="app-table-section">
                    <div class="app-table-section__surface">
                    <div class="app-table-section__header">
                        <h6 class="app-table-section__title">Artistic Events</h6>
                    </div>
                    <div class="app-table-section__body">
                        <div class="app-table-scroll">
                            <table class="table table-bordered js-datatable app-table" id="dataTable" width="100%" cellspacing="0">
                                <thead>
                                <th>Event Name</th>
                                <th>Event Rank</th>
                                <th>Domain</th>
                                </thead>
                                <tbody>
                                <tr th:each="event : ${artisticEvents}">
                                    <td th:text="${event.name}"></td>
                                    <td th:text="${event.rank}">Rank</td>
                                    <td th:text="${event.domainId}">Domain</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments :: app-footer}"></div>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fa-solid fa-angle-up"></i>
    </a>
</div>
<th:block th:replace="~{fragments :: core-scripts}"></th:block>


</body>
</html>
