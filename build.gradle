plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.19.0-rc.1'
}

group = 'ro.uvt.pokedex'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.json:json:20240303'
    // SLF4J and Logback for logging
    implementation 'org.mvel:mvel2:2.5.2.Final'
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'com.opencsv:opencsv:5.9'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-data-mongodb-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:mongodb:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'
    runtimeOnly 'org.postgresql:postgresql'
    pitest 'com.arcmutate:arcmutate-spring:1.1.2'
}

tasks.named('test') {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    systemProperty 'spring.task.scheduling.enabled', 'false'
    systemProperty 'core.scopus.scheduler.enabled', 'false'
    systemProperty 'management.health.scopusPython.enabled', 'false'
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('bootRun') {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.register('verifyFrontendAssets', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-assets'
}

tasks.register('verifyTemplateAssets', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-template-assets'
}

tasks.register('verifyDuplicationGuardrails', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-duplication-guardrails'
}

tasks.register('verifyDatatablesOptin', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-datatables-optin'
}

tasks.register('verifyArchitectureBoundaries', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-architecture-boundaries'
}

tasks.register('verifyRuntimeNamingGuardrails', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-runtime-naming-guardrails'
}

tasks.register('verifyPersistenceContracts', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-persistence-contracts'
}

tasks.register('verifySecurityValidationGuardrails', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-security-validation-guardrails'
}

tasks.register('verifyObservabilityGuardrails', Exec) {
    commandLine 'sh', '-lc', 'npm run verify-observability-guardrails'
}

tasks.named('check') {
    dependsOn tasks.named('verifyFrontendAssets')
    dependsOn tasks.named('verifyTemplateAssets')
    dependsOn tasks.named('verifyDuplicationGuardrails')
    dependsOn tasks.named('verifyDatatablesOptin')
}

tasks.register('verifyQualityGatesBaseline') {
    dependsOn tasks.named('verifyArchitectureBoundaries')
    dependsOn tasks.named('verifyRuntimeNamingGuardrails')
    dependsOn tasks.named('verifyPersistenceContracts')
    dependsOn tasks.named('verifySecurityValidationGuardrails')
    dependsOn tasks.named('verifyObservabilityGuardrails')
    dependsOn tasks.named('check')
}

tasks.register('testH226DualReadGate', Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'spring.task.scheduling.enabled', 'false'
    systemProperty 'core.scopus.scheduler.enabled', 'false'
    systemProperty 'management.health.scopusPython.enabled', 'false'
    filter {
        includeTestsMatching '*DualReadGate*'
    }
}

tasks.register('testH2210Baseline', Test) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'spring.task.scheduling.enabled', 'false'
    systemProperty 'core.scopus.scheduler.enabled', 'false'
    systemProperty 'management.health.scopusPython.enabled', 'false'
    filter {
        includeTestsMatching '*JdbcDualReadGateServiceTest'
        includeTestsMatching '*ReportingReadStoreRoutingTest'
        includeTestsMatching '*ScholardexCutoverGuardrailTest'
        includeTestsMatching '*DefaultPostgresOperationalStatusServiceTest'
        includeTestsMatching '*AdminInitializationControllerContractTest'
        includeTestsMatching '*AdminInitializationSecurityContractTest'
    }
}

// --- Test quality measurement -----------------------------------------------
// JaCoCo measures branch coverage; PIT measures mutation score.
// See docs/test-quality.md for runbook and how to read results.

jacoco {
    toolVersion = '0.8.14'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

pitest {
    pitestVersion = '1.23.1'
    junit5PluginVersion = '1.2.1'
    targetClasses = [
            'ro.uvt.pokedex.core.service.*',
            'ro.uvt.pokedex.core.handlers.*'
    ]
    targetTests = [
            'ro.uvt.pokedex.core.service.*',
            'ro.uvt.pokedex.core.handlers.*'
    ]
    threads = 4
    timestampedReports = false
    outputFormats = ['HTML', 'XML']
    mutators = ['DEFAULTS', 'SPRING']
    jvmArgs = ['-Xmx2g']
    // Keep PIT off the standard `check` lifecycle so CI isn't slowed down.
    // Run on demand via: ./gradlew pitest
}
